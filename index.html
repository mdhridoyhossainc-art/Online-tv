
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>ONLINE TV | Official</title>
<meta name="description" content="সংবাদ, বিনোদন ও মানুষের গল্পের বিশ্বস্ত ঠিকানা।">

<style>
:root {
  --red: #e5092b;
  --bg: #080808;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 38px 16px 22px;
  color: #fff;
  background:
    radial-gradient(ellipse at 12% 12%, rgba(120,65,255,.16), transparent 38%),
    radial-gradient(ellipse at 88% 25%, rgba(35,130,255,.12), transparent 38%),
    radial-gradient(ellipse at 50% 0%, rgba(229,9,43,.25), transparent 48%),
    radial-gradient(ellipse at 0% 65%, rgba(229,9,43,.16), transparent 42%),
    radial-gradient(ellipse at 100% 85%, rgba(150,0,25,.16), transparent 42%),
    linear-gradient(145deg, #080808 15%, #160711 55%, #080808 100%);
  background-attachment: fixed;
  font-family: Arial, "Noto Sans Bengali", sans-serif;
}

.container {
  width: 100%;
  max-width: 480px;
  margin: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Profile Neon Glow */
.profile {
  position: relative;
  isolation: isolate;
  width: 112px;
  height: 112px;
  padding: 4px;
  border-radius: 50%;
  background: conic-gradient(
    #ff3155, #ff9b36, #ffe45e, #25d8a0,
    #28a8ff, #a65cff, #ff3155
  );
  box-shadow:
    0 0 14px rgba(255,65,100,.30),
    0 0 30px rgba(40,168,255,.30),
    0 0 45px rgba(166,92,255,.24);
  animation: neonGlow 4s ease-in-out infinite alternate;
}

.profile img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  border-radius: 50%;
  border: 3px solid #111;
  background: #191919;
  filter: none;
}

@keyframes neonGlow {
  from {
    box-shadow:
      0 0 12px rgba(255,65,100,.25),
      0 0 28px rgba(40,168,255,.22),
      0 0 42px rgba(166,92,255,.18);
  }
  to {
    box-shadow:
      0 0 20px rgba(255,65,100,.45),
      0 0 38px rgba(40,168,255,.40),
      0 0 52px rgba(166,92,255,.35);
  }
}

h1 {
  margin: 17px 0 7px;
  font-size: 27px;
  font-weight: 800;
  letter-spacing: 1.5px;
  text-align: center;
}

.tagline {
  max-width: 400px;
  margin: 0 0 19px;
  color: #c8c8c8;
  font-size: 14px;
  line-height: 1.8;
  text-align: center;
}

/* Social Icons */
.socials {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 19px;
  margin-bottom: 27px;
}

.socials a {
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,.055);
  border: 1px solid rgba(255,255,255,.28);
  border-radius: 50%;
  transition: .25s ease;
  box-shadow:
    inset 0 1px 4px rgba(255,255,255,.2),
    0 4px 14px rgba(0,0,0,.25);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.socials svg {
  width: 23px;
  height: 23px;
  display: block;
}

.socials a.social-facebook { color: #1877F2; }
.socials a.social-facebook svg { fill: #1877F2; }

.socials a.social-instagram { color: #E4405F; }
.socials a.social-instagram svg { fill: none; }

.socials a.social-youtube { color: #FF0033; }
.socials a.social-youtube svg { fill: #FF0033; }

.socials a.social-whatsapp { color: #25D366; }
.socials a.social-whatsapp svg { fill: #25D366; }

.socials a:hover {
  transform: translateY(-4px) scale(1.09);
  background: rgba(255,255,255,.12);
  box-shadow: 0 0 18px currentColor;
}

/* Video Glass Bezel */
.video-section {
  width: 100%;
  margin-bottom: 25px;
}

.section-label {
  margin: 0 0 12px;
  color: #aaa;
  font-size: 11px;
  letter-spacing: 2px;
  text-align: center;
}

.video-box {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  background: rgba(255,255,255,.07);
  border: 1.5px solid rgba(255,255,255,.62);
  border-radius: 20px;
  box-shadow:
    inset 0 1px 4px rgba(255,255,255,.35),
    inset 0 0 15px rgba(255,255,255,.08),
    0 0 0 2px rgba(229,9,43,.20),
    0 0 22px rgba(229,9,43,.22),
    0 10px 32px rgba(0,0,0,.48);
  transition: .3s ease;
}

.video-box::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 2;
  border: 1px solid rgba(255,255,255,.38);
  border-radius: inherit;
  pointer-events: none;
  box-shadow:
    inset 0 2px 12px rgba(255,255,255,.18),
    inset 0 -2px 10px rgba(229,9,43,.12);
}

.video-box:hover {
  border-color: rgba(255,255,255,.85);
  box-shadow:
    inset 0 1px 4px rgba(255,255,255,.4),
    0 0 0 2px rgba(229,9,43,.28),
    0 0 30px rgba(229,9,43,.32),
    0 12px 38px rgba(0,0,0,.5);
}

.video-link {
  position: absolute;
  inset: 0;
  display: block;
  text-decoration: none;
  color: white;
}

.video-thumbnail {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  transition: transform .4s ease;
}

.video-link:hover .video-thumbnail {
  transform: scale(1.04);
}

/* Soft Red Glass Play Button */
.play-button {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 65px;
  height: 65px;
  display: flex;
  align-items: center;
  justify-content: center;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: rgba(229,9,43,.28);
  border: 1px solid rgba(255,255,255,.55);
  backdrop-filter: blur(16px) saturate(160%);
  -webkit-backdrop-filter: blur(16px) saturate(160%);
  box-shadow:
    inset 0 1px 4px rgba(255,255,255,.4),
    0 0 14px rgba(229,9,43,.15);
  transition: .25s ease;
}

.play-button::after {
  content: "";
  margin-left: 5px;
  border-top: 12px solid transparent;
  border-bottom: 12px solid transparent;
  border-left: 18px solid white;
  filter: drop-shadow(0 1px 2px rgba(0,0,0,.3));
}

.video-link:hover .play-button {
  transform: translate(-50%, -50%) scale(1.10);
  background: rgba(229,9,43,.38);
  box-shadow: 0 0 20px rgba(229,9,43,.22);
}

.video-caption {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 25px 12px 10px;
  background: linear-gradient(transparent, rgba(0,0,0,.8));
  font-size: 11px;
  letter-spacing: 1px;
  text-align: center;
}

/* Red Liquid Glass Buttons */
.buttons {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.action-btn {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  width: 100%;
  min-height: 78px;
  padding: 14px 65px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  text-align: center;
  text-decoration: none;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: .3px;

  background: linear-gradient(
    125deg,
    rgba(229,9,43,.48) 0%,
    rgba(190,0,35,.38) 45%,
    rgba(229,9,43,.32) 100%
  );

  border: 1px solid rgba(255,255,255,.65);
  border-radius: 22px;

  backdrop-filter: blur(30px) saturate(230%);
  -webkit-backdrop-filter: blur(30px) saturate(230%);

  box-shadow:
    inset 0 1px 4px rgba(255,255,255,.48),
    inset 0 -2px 10px rgba(229,9,43,.30),
    inset 0 0 22px rgba(255,255,255,.10),
    0 8px 25px rgba(0,0,0,.30),
    0 0 25px rgba(229,9,43,.32);

  transition:
    transform .35s ease,
    box-shadow .35s ease,
    border-color .35s ease,
    background .35s ease;
}

.action-btn::before {
  content: "";
  position: absolute;
  inset: 1px;
  z-index: 0;
  border-radius: 21px;
  background: linear-gradient(
    125deg,
    rgba(255,255,255,.48) 0%,
    rgba(255,255,255,.16) 18%,
    transparent 42%,
    rgba(255,255,255,.08) 72%,
    transparent 100%
  );
  pointer-events: none;
}

.action-btn::after {
  content: "";
  position: absolute;
  top: 0;
  left: 10%;
  width: 80%;
  height: 1px;
  background: rgba(255,255,255,.95);
  box-shadow: 0 0 12px rgba(255,255,255,.75);
  z-index: 1;
  pointer-events: none;
}

.action-btn:hover {
  transform: translateY(-4px);
  border-color: rgba(255,255,255,.95);
  background: linear-gradient(
    125deg,
    rgba(229,9,43,.62),
    rgba(190,0,35,.48),
    rgba(229,9,43,.42)
  );
  box-shadow:
    inset 0 2px 5px rgba(255,255,255,.6),
    inset 0 0 22px rgba(255,255,255,.12),
    0 13px 35px rgba(0,0,0,.4),
    0 0 30px rgba(229,9,43,.38);
}

.action-btn:active {
  transform: translateY(-1px) scale(.99);
}

/* Compact Brand Icons */
.btn-icon {
  position: absolute;
  z-index: 2;
  left: 20px;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 11px;
  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.4),
    0 3px 8px rgba(0,0,0,.25);
}

.btn-icon svg {
  width: 23px;
  height: 23px;
  display: block;
  filter: grayscale(1) brightness(0) invert(1);
}

.btn-icon-facebook { background: #1877F2; }

.btn-icon-instagram {
  background: linear-gradient(
    135deg,#FFD600,#FF7A00,#FF0169,#7638FA
  );
}

.btn-icon-youtube { background: #FF0033; }
.btn-icon-whatsapp { background: #25D366; }

.btn-label {
  position: relative;
  z-index: 2;
}

/* Footer */
.footer {
  margin-top: 36px;
  text-align: center;
}

.footer strong {
  display: block;
  color: #aaa;
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 3px;
}

.footer small {
  display: block;
  margin-top: 5px;
  color: var(--red);
  font-size: 7px;
  letter-spacing: 2px;
}

.loading {
  padding: 18px;
  color: #999;
  font-size: 13px;
  text-align: center;
}

@media (min-width: 700px) {
  body { padding-top: 48px; }
  .profile { width: 120px; height: 120px; }
  h1 { font-size: 30px; }
}

@media (max-width: 380px) {
  body {
    padding-left: 13px;
    padding-right: 13px;
  }

  h1 { font-size: 24px; }

  .action-btn {
    min-height: 72px;
    font-size: 14px;
  }

  .btn-icon {
    width: 33px;
    height: 33px;
    left: 15px;
  }

  .btn-icon svg {
    width: 21px;
    height: 21px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>
<main class="container">

  <div class="profile">
    <img id="profileImage" src="" alt="ONLINE TV">
  </div>

  <h1 id="title">ONLINE TV</h1>

  <p class="tagline" id="tagline">
    সংবাদ • বিনোদন • মানুষের গল্প
  </p>

  <nav class="socials" id="socials"></nav>

  <section class="video-section" id="videoSection" hidden>
    <p class="section-label">LATEST VIDEO</p>

    <div class="video-box">
      <a id="videoLink"
         class="video-link"
         href="#"
         target="_blank"
         rel="noopener noreferrer"
         aria-label="YouTube-এ সর্বশেষ ভিডিও দেখুন">

        <img id="videoThumbnail"
             class="video-thumbnail"
             src=""
             alt="ONLINE TV Latest Video">

        <span class="play-button"></span>

        <span class="video-caption">
          WATCH ON YOUTUBE
        </span>
      </a>
    </div>
  </section>

  <section class="buttons" id="buttons">
    <div class="loading">তথ্য লোড হচ্ছে...</div>
  </section>

  <footer class="footer">
    <strong>ONLINE TV OFFICIAL</strong>
    <small>DIGITAL MEDIA PLATFORM</small>
  </footer>

</main>

<script>
const APPS_SCRIPT_URL =
'https://script.google.com/macros/s/AKfycbzA5VHTZL0Izp_9yi3_eI99Ju0Fwz_Eb8KHYY-ENXR8GKbcfRL7uBDVu_yju_nBw4mX/exec';

/* Instagram Gradient SVG */
function makeInstagramSVG(id) {
  return `
  <svg viewBox="0 0 24 24" fill="none"
       xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="${id}"
        x1="3" y1="21" x2="21" y2="3"
        gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#FFD600"/>
        <stop offset="35%" stop-color="#FF7A00"/>
        <stop offset="65%" stop-color="#FF0169"/>
        <stop offset="100%" stop-color="#7638FA"/>
      </linearGradient>
    </defs>
    <rect x="3" y="3" width="18" height="18" rx="5"
          stroke="url(#${id})" stroke-width="2"/>
    <circle cx="12" cy="12" r="4"
            stroke="url(#${id})" stroke-width="2"/>
    <circle cx="17.5" cy="6.5" r="1"
            fill="url(#${id})"/>
  </svg>`;
}

const socialIcons = {
  facebook: `<svg viewBox="0 0 24 24" fill="#1877F2">
    <path d="M13.5 21v-8h2.7l.4-3h-3.1V8.1c0-.9.3-1.5 1.6-1.5h1.6V3.9c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3V10H7.2v3h2.8v8z"/>
  </svg>`,

  instagram: makeInstagramSVG('instagramSocialGradient'),

  youtube: `<svg viewBox="0 0 24 24" fill="#FF0033">
    <path d="M23 7a3 3 0 0 0-2.1-2.1C19 4.4 12 4.4 12 4.4s-7 0-8.9.5A3 3 0 0 0 1 7a31 31 0 0 0-.5 5 31 31 0 0 0 .5 5 3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5A3 3 0 0 0 23 17a31 31 0 0 0 .5-5 31 31 0 0 0-.5-5zM9.6 15.5v-7l6 3.5z"/>
  </svg>`,

  whatsapp: `<svg viewBox="0 0 24 24" fill="#25D366">
    <path d="M12 2a9.8 9.8 0 0 0-8.4 14.8L2 22l5.4-1.5A9.8 9.8 0 1 0 12 2zm0 17.8a8 8 0 0 1-4.1-1.1l-.3-.2-3.2.9.9-3.1-.2-.3A8 8 0 1 1 12 19.8zm4.4-6c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1-.2.2-.6.8-.8.9-.1.2-.3.2-.5.1-.2-.1-1-.4-1.9-1.2-.7-.6-1.2-1.4-1.3-1.6-.1-.2 0-.3.1-.5l.4-.4.2-.4c.1-.2 0-.3 0-.4l-.7-1.7c-.2-.4-.4-.4-.5-.4h-.5c-.2 0-.4.1-.6.3-.2.2-.8.8-.8 1.9s.8 2.2.9 2.4c.1.2 1.6 2.5 3.8 3.4 1.4.6 1.9.6 2.6.5.4-.1 1.4-.6 1.6-1.1.2-.5.2-1 .1-1.1-.1-.1-.2-.2-.4-.3z"/>
  </svg>`
};

function safeUrl(value) {
  try {
    const url = new URL(String(value || '').trim());
    return ['https:', 'http:'].includes(url.protocol) ? url.href : '';
  } catch (error) {
    return '';
  }
}

function getYouTubeVideoId(value) {
  try {
    const url = new URL(value);
    let id = '';

    if (url.hostname.includes('youtu.be')) {
      id = url.pathname.split('/').filter(Boolean)[0] || '';
    } else if (url.pathname.startsWith('/shorts/')) {
      id = url.pathname.split('/')[2] || '';
    } else if (url.pathname.startsWith('/embed/')) {
      id = url.pathname.split('/')[2] || '';
    } else {
      id = url.searchParams.get('v') || '';
    }

    return /^[a-zA-Z0-9_-]{11}$/.test(id) ? id : '';
  } catch (error) {
    return '';
  }
}

function addSocial(name, url) {
  const validUrl = safeUrl(url);
  if (!validUrl || !socialIcons[name]) return;

  const link = document.createElement('a');
  link.className = 'social-' + name;
  link.href = validUrl;
  link.target = '_blank';
  link.rel = 'noopener noreferrer';
  link.setAttribute('aria-label', name);
  link.innerHTML = socialIcons[name];

  document.getElementById('socials').appendChild(link);
}

function detectBrand(label, url) {
  let host = '';

  try {
    host = new URL(url).hostname.toLowerCase();
  } catch (error) {}

  const text = (String(label || '') + ' ' + String(url || '')).toLowerCase();

  if (host.includes('facebook.com') || host.includes('fb.com') || text.includes('facebook')) return 'facebook';
  if (host.includes('instagram.com') || host.includes('instagr.am') || text.includes('instagram')) return 'instagram';
  if (host.includes('whatsapp.com') || host.includes('wa.me') || text.includes('whatsapp')) return 'whatsapp';
  if (host.includes('youtube.com') || host.includes('youtu.be') || text.includes('youtube')) return 'youtube';

  return '';
}

function addButton(icon, label, url) {
  const validUrl = safeUrl(url);
  if (!validUrl || !String(label || '').trim()) return;

  const link = document.createElement('a');
  link.className = 'action-btn';
  link.href = validUrl;
  link.target = '_blank';
  link.rel = 'noopener noreferrer';

  const brand = detectBrand(label, validUrl);

  const iconElement = document.createElement('span');
  iconElement.className = 'btn-icon';

  if (brand === 'instagram') {
    iconElement.classList.add('btn-icon-instagram');
    iconElement.innerHTML = makeInstagramSVG('instagramButtonGradient');
  } else if (brand && socialIcons[brand]) {
    iconElement.classList.add('btn-icon-' + brand);
    iconElement.innerHTML = socialIcons[brand];
  } else {
    iconElement.textContent = icon || '🔗';
  }

  const labelElement = document.createElement('span');
  labelElement.className = 'btn-label';
  labelElement.textContent = label;

  link.appendChild(iconElement);
  link.appendChild(labelElement);

  document.getElementById('buttons').appendChild(link);
}

function showError(message) {
  document.getElementById('buttons').innerHTML = '';

  const messageElement = document.createElement('p');
  messageElement.className = 'loading';
  messageElement.textContent = message;

  document.getElementById('buttons').appendChild(messageElement);
}

function renderProfile(data) {
  if (!data || typeof data !== 'object') {
    showError('সঠিক তথ্য পাওয়া যায়নি।');
    return;
  }

  document.title = (data.title || 'ONLINE TV') + ' | Official';

  document.getElementById('title').textContent =
    String(data.title || 'ONLINE TV').replace(/:$/, '').trim();

  document.getElementById('tagline').textContent =
    data.tagline || '';

  const imageUrl = safeUrl(data.profileImage || data.logoText);

  if (imageUrl) {
    document.getElementById('profileImage').src = imageUrl;
  }

  document.getElementById('socials').innerHTML = '';

  ['facebook', 'instagram', 'youtube', 'whatsapp'].forEach(function(name) {
    addSocial(name, data[name]);
  });

  /* Latest YouTube video */
  const videoUrl = safeUrl(data.latestVideoUrl || data.videoUrl);
  const videoId = videoUrl ? getYouTubeVideoId(videoUrl) : '';

  const videoSection = document.getElementById('videoSection');

  if (videoId) {
    document.getElementById('videoLink').href =
      'https://www.youtube.com/watch?v=' + videoId;

    document.getElementById('videoThumbnail').src =
      'https://i.ytimg.com/vi/' + videoId + '/hqdefault.jpg';

    videoSection.hidden = false;
  } else {
    videoSection.hidden = true;
  }

  /* Custom buttons */
  const buttons = document.getElementById('buttons');
  buttons.innerHTML = '';

  /* First three custom buttons from Google Sheet */
  for (let i = 1; i <= 3; i++) {
    addButton(
      data['button' + i + 'Icon'],
      data['button' + i + 'Text'],
      data['button' + i + 'Url']
    );
  }

  /* WhatsApp button added separately from Sheet whatsapp field */
  const whatsappUrl = safeUrl(data.whatsapp);

  if (whatsappUrl) {
    addButton(
      '',
      'WhatsApp',
      whatsappUrl
    );
  }

  if (!buttons.children.length) {
    showError('কাস্টম বাটন এখনো যোগ করা হয়নি।');
  }
}

function loadProfile() {
  const callbackName = 'onlineTVCallback_' + Date.now();

  let finished = false;
  const script = document.createElement('script');

  const timeout = setTimeout(function() {
    if (finished) return;

    finished = true;
    delete window[callbackName];
    script.remove();

    showError('তথ্য লোড হয়নি। আবার চেষ্টা করুন।');
  }, 20000);

  window[callbackName] = function(data) {
    if (finished) return;

    finished = true;
    clearTimeout(timeout);

    try {
      renderProfile(data);
    } catch (error) {
      console.error('Profile display error:', error);
      showError('প্রোফাইল দেখাতে সমস্যা হয়েছে।');
    }

    delete window[callbackName];
    script.remove();
  };

  script.onerror = function() {
    if (finished) return;

    finished = true;
    clearTimeout(timeout);
    delete window[callbackName];

    showError('Google Apps Script-এর সঙ্গে সংযোগ হয়নি।');
    script.remove();
  };

  script.src = APPS_SCRIPT_URL +
    '?callback=' + encodeURIComponent(callbackName) +
    '&t=' + Date.now();

  document.body.appendChild(script);
}

loadProfile();
</script>
