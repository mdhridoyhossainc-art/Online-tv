
<style>
:root {
  --red: #b8002e;
  --deep-red: #570018;
  --black: #050505;
  --glass: rgba(255,255,255,.075);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 38px 16px 22px;
  color: #fff;
  background:
    radial-gradient(ellipse at 10% 15%, rgba(160,0,35,.40), transparent 50%),
    radial-gradient(ellipse at 90% 80%, rgba(110,0,25,.28), transparent 48%),
    linear-gradient(145deg, #050505, #24000b 48%, #080808 100%);
  background-attachment: fixed;
  font-family: Arial, "Noto Sans Bengali", sans-serif;
}

.container {
  width: 100%;
  max-width: 480px;
  margin: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* PROFILE */

.profile {
  width: 112px;
  height: 112px;
  padding: 4px;
  border-radius: 50%;
  background: conic-gradient(
    #ff1744, #ff9b36, #ffe45e,
    #25d8a0, #ff1744
  );
}

.profile img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
  border: 3px solid #080808;
  background: #111;
}

/* TITLE */

h1 {
  margin: 17px 0 7px;
  font-size: 27px;
  font-weight: 800;
  letter-spacing: 1.5px;
  text-align: center;
}

.tagline {
  max-width: 400px;
  margin: 0 0 19px;
  color: #f4dce2;
  font-size: 14px;
  line-height: 1.8;
  text-align: center;
}

/* SOCIAL ICONS */

.socials {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 19px;
  margin-bottom: 27px;
}

.socials a {
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.30);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  transition: .25s ease;
}

.socials svg {
  width: 23px;
  height: 23px;
}

.socials a.social-facebook { color: #1877F2; }
.socials a.social-facebook svg { fill: #1877F2; }

.socials a.social-instagram {
  color: #fff;
  background: linear-gradient(
    135deg,
    #FFD600, #FF7A00 30%,
    #FF0169 65%, #315bff
  );
}

.socials a.social-youtube { color: #FF0033; }
.socials a.social-youtube svg { fill: #FF0033; }

.socials a.social-whatsapp { color: #25D366; }
.socials a.social-whatsapp svg { fill: #25D366; }

.socials a:hover {
  transform: translateY(-3px);
}

/* LATEST VIDEO */

.video-section {
  width: 100%;
  margin-bottom: 25px;
}

.section-label {
  margin: 0 0 12px;
  color: #ffe4e9;
  font-size: 11px;
  letter-spacing: 2px;
  text-align: center;
}

.video-box {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  background: #170008;
  border: 1px solid rgba(255,255,255,.35);
  border-radius: 18px;
}

.video-link {
  position: absolute;
  inset: 0;
  display: block;
  color: #fff;
  text-decoration: none;
}

.video-thumbnail {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
}

.play-button {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 52px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: rgba(130,0,35,.78);
  border: 1px solid rgba(255,255,255,.65);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.play-button::after {
  content: "";
  margin-left: 3px;
  border-top: 9px solid transparent;
  border-bottom: 9px solid transparent;
  border-left: 14px solid #fff;
}

.video-caption {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 25px 12px 10px;
  background: linear-gradient(transparent, rgba(0,0,0,.75));
  font-size: 11px;
  letter-spacing: 1px;
  text-align: center;
}

/* GLASS BUTTONS - NO SHADOW */

.buttons {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 17px;
}

.action-btn {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  width: 100%;
  min-height: 80px;
  padding: 15px 68px;

  display: flex;
  align-items: center;
  justify-content: center;

  color: #fff;
  text-align: center;
  text-decoration: none;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: .45px;

  /* Transparent glass surface */
  background: linear-gradient(
    120deg,
    rgba(255,255,255,.12),
    rgba(255,255,255,.045) 50%,
    rgba(255,255,255,.09)
  );

  border: 1px solid rgba(255,255,255,.38);
  border-radius: 20px;

  backdrop-filter: blur(20px) saturate(150%);
  -webkit-backdrop-filter: blur(20px) saturate(150%);

  /* No shadow */
  box-shadow: none;

  transition: background .3s ease, border-color .3s ease;
}

/* Glass reflection */

.action-btn::before {
  content: "";
  position: absolute;
  inset: 1px;
  z-index: 0;
  border-radius: 19px;
  background: linear-gradient(
    115deg,
    rgba(255,255,255,.20),
    rgba(255,255,255,.045) 35%,
    transparent 65%,
    rgba(255,255,255,.09)
  );
  pointer-events: none;
}

/* Moving light */

.action-btn::after {
  content: "";
  position: absolute;
  top: -80%;
  left: -65%;
  width: 42%;
  height: 260%;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.25),
    transparent
  );
  transform: rotate(24deg);
  transition: left .75s ease;
}

.action-btn:hover::after {
  left: 130%;
}

.action-btn:hover {
  background: rgba(180,0,45,.18);
  border-color: rgba(255,255,255,.65);
  box-shadow: none;
  transform: none;
}

.action-btn:active {
  background: rgba(180,0,45,.25);
}

/* BUTTON ICON */

.btn-icon {
  position: absolute;
  z-index: 2;
  left: 19px;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 13px;

  background: rgba(255,255,255,.10);
  border: 1px solid rgba(255,255,255,.35);

  box-shadow: none;
}

.btn-icon svg {
  width: 23px;
  height: 23px;
  display: block;
  filter: grayscale(1) brightness(0) invert(1);
}

.btn-icon-facebook {
  background: #1877F2;
}

.btn-icon-instagram {
  background: linear-gradient(
    135deg,
    #FFD600, #FF7A00 30%,
    #FF0169 65%, #315bff
  );
}

.btn-icon-instagram svg {
  filter: none;
}

.btn-icon-youtube {
  background: #e60023;
}

.btn-icon-whatsapp {
  background: #16b95b;
}

.btn-label {
  position: relative;
  z-index: 2;
  color: #fff;
  text-shadow: none;
}

/* FOOTER */

.footer {
  margin-top: 36px;
  text-align: center;
}

.footer strong {
  display: block;
  color: #fff;
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 3px;
}

.footer small {
  display: block;
  margin-top: 5px;
  color: #ff5275;
  font-size: 7px;
  letter-spacing: 2px;
}

/* RESPONSIVE */

@media (max-width: 380px) {
  body {
    padding-left: 13px;
    padding-right: 13px;
  }

  h1 {
    font-size: 24px;
  }

  .buttons {
    gap: 14px;
  }

  .action-btn {
    min-height: 73px;
    padding: 13px 58px;
    font-size: 14px;
    border-radius: 19px;
  }

  .btn-icon {
    width: 36px;
    height: 36px;
    left: 15px;
  }
}
</style>
