
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>ONLINE TV | Official</title>
<meta name="description" content="সংবাদ, বিনোদন ও মানুষের গল্পের বিশ্বস্ত ঠিকানা।">

<style>
:root {
  --red: #e5092b;
  --bg: #080808;
  --glass: rgba(255,255,255,.055);
  --border: rgba(255,255,255,.13);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 38px 16px 22px;
  color: #fff;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(229,9,43,.23), transparent 48%),
    radial-gradient(ellipse at 0% 65%, rgba(229,9,43,.10), transparent 35%),
    radial-gradient(ellipse at 100% 85%, rgba(120,0,20,.10), transparent 38%),
    var(--bg);
  font-family: Arial, "Noto Sans Bengali", sans-serif;
}

.container {
  width: 100%;
  max-width: 480px;
  margin: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Profile Neon Glow */
.profile {
  position: relative;
  isolation: isolate;
  width: 112px;
  height: 112px;
  padding: 4px;
  border-radius: 50%;
  background: conic-gradient(
    #ff3155,
    #ff9b36,
    #ffe45e,
    #25d8a0,
    #28a8ff,
    #a65cff,
    #ff3155
  );
  box-shadow:
    0 0 12px rgba(255,65,100,.35),
    0 0 28px rgba(40,168,255,.20),
    0 0 42px rgba(255,155,54,.15);
  animation: neonGlow 4s ease-in-out infinite alternate;
}

.profile img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
  border: 3px solid #111;
  background: #191919;
}

@keyframes neonGlow {
  from {
    box-shadow:
      0 0 12px rgba(255,65,100,.35),
      0 0 28px rgba(40,168,255,.20),
      0 0 42px rgba(255,155,54,.15);
  }
  to {
    box-shadow:
      0 0 18px rgba(255,65,100,.55),
      0 0 35px rgba(40,168,255,.32),
      0 0 50px rgba(255,155,54,.25);
  }
}

h1 {
  margin: 17px 0 7px;
  font-size: 27px;
  font-weight: 800;
  letter-spacing: 1.5px;
  text-align: center;
}

.tagline {
  max-width: 400px;
  margin: 0 0 19px;
  color: #c8c8c8;
  font-size: 14px;
  line-height: 1.8;
  text-align: center;
}

/* Colorful Social Icons */
.socials {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 19px;
  margin-bottom: 27px;
}

.socials a {
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,.55);
  border: 1px solid rgba(255,255,255,.17);
  border-radius: 50%;
  transition: transform .25s ease, box-shadow .25s ease,
              border-color .25s ease, background .25s ease;
  box-shadow: inset 0 1px rgba(255,255,255,.06);
}

.socials svg {
  width: 20px;
  height: 20px;
  fill: currentColor;
}

/* Facebook */
.socials a.social-facebook {
  color: #1877F2;
}

/* Instagram */
.socials a.social-instagram {
  color: #E4405F;
}

.socials a.social-instagram svg {
  fill: url(#instagramGradient);
}

/* YouTube */
.socials a.social-youtube {
  color: #FF0033;
}

/* WhatsApp */
.socials a.social-whatsapp {
  color: #25D366;
}

.socials a:hover {
  transform: translateY(-4px) scale(1.07);
  background: rgba(255,255,255,.09);
}

.socials a.social-facebook:hover {
  border-color: #1877F2;
  box-shadow: 0 0 16px rgba(24,119,242,.35);
}

.socials a.social-instagram:hover {
  border-color: #E4405F;
  box-shadow: 0 0 16px rgba(228,64,95,.35);
}

.socials a.social-youtube:hover {
  border-color: #FF0033;
  box-shadow: 0 0 16px rgba(255,0,51,.35);
}

.socials a.social-whatsapp:hover {
  border-color: #25D366;
  box-shadow: 0 0 16px rgba(37,211,102,.35);
}

/* Latest Video - Glass Bezel */
.video-section {
  width: 100%;
  margin-bottom: 25px;
}

.section-label {
  margin: 0 0 12px;
  color: #aaa;
  font-size: 11px;
  letter-spacing: 2px;
  text-align: center;
}

.video-box {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  background: #151515;
  border: 1px solid rgba(255,255,255,.23);
  border-radius: 19px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.15),
    0 0 0 1px rgba(229,9,43,.10),
    0 0 18px rgba(229,9,43,.13),
    0 10px 35px rgba(0,0,0,.35);
  transition: box-shadow .3s ease, border-color .3s ease;
}

.video-box::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 2;
  border: 1px solid rgba(255,255,255,.16);
  border-radius: inherit;
  pointer-events: none;
  box-shadow: inset 0 1px 5px rgba(255,255,255,.10);
}

.video-box:hover {
  border-color: rgba(229,9,43,.48);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.18),
    0 0 0 1px rgba(229,9,43,.18),
    0 0 25px rgba(229,9,43,.22),
    0 12px 38px rgba(0,0,0,.4);
}

.video-link {
  position: absolute;
  inset: 0;
  display: block;
  text-decoration: none;
  color: white;
}

.video-thumbnail {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  transition: transform .4s ease;
}

.video-link:hover .video-thumbnail {
  transform: scale(1.04);
}

.play-button {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 65px;
  height: 65px;
  display: flex;
  align-items: center;
  justify-content: center;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: rgba(229,9,43,.95);
  box-shadow: 0 0 30px rgba(229,9,43,.45);
  transition: transform .25s ease, box-shadow .25s ease;
}

.play-button::after {
  content: "";
  margin-left: 5px;
  border-top: 12px solid transparent;
  border-bottom: 12px solid transparent;
  border-left: 18px solid white;
}

.video-link:hover .play-button {
  transform: translate(-50%, -50%) scale(1.12);
  box-shadow: 0 0 38px rgba(229,9,43,.65);
}

.video-caption {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 25px 12px 10px;
  background: linear-gradient(transparent, rgba(0,0,0,.8));
  font-size: 11px;
  letter-spacing: 1px;
  text-align: center;
}

/* Red Liquid Glass Buttons */
.buttons {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 13px;
}

.action-btn {
  position: relative;
  width: 100%;
  min-height: 66px;
  padding: 12px 55px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  text-align: center;
  text-decoration: none;
  font-size: 15px;
  font-weight: 700;

  background:
    linear-gradient(115deg,
      rgba(229,9,43,.13),
      rgba(255,255,255,.055) 48%,
      rgba(120,0,20,.12));

  border: 1px solid rgba(255,255,255,.17);
  border-radius: 16px;

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);

  box-shadow:
    inset 0 1px rgba(255,255,255,.11),
    inset 0 -1px rgba(229,9,43,.08),
    0 8px 25px rgba(0,0,0,.25),
    0 0 15px rgba(229,9,43,.045);

  transition: transform .25s ease, border-color .25s ease,
              box-shadow .25s ease, background .25s ease;
}

.action-btn:hover {
  transform: translateY(-3px);
  border-color: rgba(229,9,43,.65);

  background:
    linear-gradient(115deg,
      rgba(229,9,43,.24),
      rgba(255,255,255,.075),
      rgba(120,0,20,.19));

  box-shadow:
    inset 0 1px rgba(255,255,255,.15),
    0 10px 28px rgba(0,0,0,.3),
    0 0 20px rgba(229,9,43,.12);
}

.btn-icon {
  position: absolute;
  left: 19px;
  width: 29px;
  height: 29px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  opacity: 1;
}

/* Footer */
.footer {
  margin-top: 36px;
  text-align: center;
}

.footer strong {
  display: block;
  color: #aaa;
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 3px;
}

.footer small {
  display: block;
  margin-top: 5px;
  color: var(--red);
  font-size: 7px;
  letter-spacing: 2px;
}

.loading {
  padding: 18px;
  color: #999;
  font-size: 13px;
  text-align: center;
}

@media (min-width: 700px) {
  body { padding-top: 48px; }
  .profile { width: 120px; height: 120px; }
  h1 { font-size: 30px; }
}

@media (max-width: 380px) {
  body { padding-left: 13px; padding-right: 13px; }
  h1 { font-size: 24px; }
  .action-btn { min-height: 61px; font-size: 14px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>
<main class="container">

  <div class="profile">
    <img id="profileImage" src="" alt="ONLINE TV">
  </div>

  <h1 id="title">ONLINE TV</h1>

  <p class="tagline" id="tagline">
    সংবাদ • বিনোদন • মানুষের গল্প
  </p>

  <nav class="socials" id="socials"></nav>

  <section class="video-section" id="videoSection" hidden>
    <p class="section-label">LATEST VIDEO</p>

    <div class="video-box">
      <a id="videoLink"
         class="video-link"
         href="#"
         target="_blank"
         rel="noopener noreferrer"
         aria-label="YouTube-এ সর্বশেষ ভিডিও দেখুন">

        <img id="videoThumbnail"
             class="video-thumbnail"
             src=""
             alt="ONLINE TV Latest Video">

        <span class="play-button"></span>

        <span class="video-caption">
          WATCH ON YOUTUBE
        </span>
      </a>
    </div>
  </section>

  <section class="buttons" id="buttons">
    <div class="loading">তথ্য লোড হচ্ছে...</div>
  </section>

  <footer class="footer">
    <strong>ONLINE TV OFFICIAL</strong>
    <small>DIGITAL MEDIA PLATFORM</small>
  </footer>

</main>

<script>
const APPS_SCRIPT_URL =
'https://script.google.com/macros/s/AKfycbzA5VHTZL0Izp_9yi3_eI99Ju0Fwz_Eb8KHYY-ENXR8GKbcfRL7uBDVu_yju_nBw4mX/exec';

const socialIcons = {
  facebook:
  '<svg viewBox="0 0 24 24"><path d="M13.5 21v-8h2.7l.4-3h-3.1V8.1c0-.9.3-1.5 1.6-1.5h1.6V3.9c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3V10H7.2v3h2.8v8z"/></svg>',

  instagram:
  '<svg viewBox="0 0 24 24"><defs><linearGradient id="instagramGradient" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#FFD600"/><stop offset="35%" stop-color="#FF7A00"/><stop offset="65%" stop-color="#FF0169"/><stop offset="100%" stop-color="#7638FA"/></linearGradient></defs><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3zm5 3a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm5.5-3a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4z" fill="url(#instagramGradient)"/></svg>',

  youtube:
  '<svg viewBox="0 0 24 24"><path d="M23 7a3 3 0 0 0-2.1-2.1C19 4.4 12 4.4 12 4.4s-7 0-8.9.5A3 3 0 0 0 1 7a31 31 0 0 0-.5 5 31 31 0 0 0 .5 5 3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5A3 3 0 0 0 23 17a31 31 0 0 0 .5-5 31 31 0 0 0-.5-5zM9.6 15.5v-7l6 3.5z"/></svg>',

  whatsapp:
  '<svg viewBox="0 0 24 24"><path d="M12 2a9.8 9.8 0 0 0-8.4 14.8L2 22l5.4-1.5A9.8 9.8 0 1 0 12 2zm0 17.8a8 8 0 0 1-4.1-1.1l-.3-.2-3.2.9.9-3.1-.2-.3A8 8 0 1 1 12 19.8zm4.4-6c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1-.2.2-.6.8-.8.9-.1.2-.3.2-.5.1-.2-.1-1-.4-1.9-1.2-.7-.6-1.2-1.4-1.3-1.6-.1-.2 0-.3.1-.5l.4-.4.2-.4c.1-.2 0-.3 0-.4l-.7-1.7c-.2-.4-.4-.4-.5-.4h-.5c-.2 0-.4.1-.6.3-.2.2-.8.8-.8 1.9s.8 2.2.9 2.4c.1.2 1.6 2.5 3.8 3.4 1.4.6 1.9.6 2.6.5.4-.1 1.4-.6 1.6-1.1.2-.5.2-1 .1-1.1-.1-.1-.2-.2-.4-.3z"/></svg>'
};

function safeUrl(value) {
  try {
    const url = new URL(String(value || '').trim());
    return ['https:', 'http:'].includes(url.protocol) ? url.href : '';
  } catch (error) {
    return '';
  }
}

function getYouTubeVideoId(value) {
  try {
    const url = new URL(value);
    let id = '';

    if (url.hostname.includes('youtu.be')) {
      id = url.pathname.split('/').filter(Boolean)[0] || '';
    } else if (url.pathname.startsWith('/shorts/')) {
      id = url.pathname.split('/')[2] || '';
    } else if (url.pathname.startsWith('/embed/')) {
      id = url.pathname.split('/')[2] || '';
    } else {
      id = url.searchParams.get('v') || '';
    }

    return /^[a-zA-Z0-9_-]{11}$/.test(id) ? id : '';
  } catch (error) {
    return '';
  }
}

function addSocial(name, url) {
  const validUrl = safeUrl(url);
  if (!validUrl || !socialIcons[name]) return;

  const link = document.createElement('a');
  link.className = 'social-' + name;
  link.href = validUrl;
  link.target = '_blank';
  link.rel = 'noopener noreferrer';
  link.setAttribute('aria-label', name);
  link.innerHTML = socialIcons[name];

  document.getElementById('socials').appendChild(link);
}

function addButton(icon, label, url) {
  const validUrl = safeUrl(url);
  if (!validUrl || !String(label || '').trim()) return;

  const link = document.createElement('a');
  link.className = 'action-btn';
  link.href = validUrl;
  link.target = '_blank';
  link.rel = 'noopener noreferrer';

  const iconElement = document.createElement('span');
  iconElement.className = 'btn-icon';
  iconElement.textContent = icon || '🔗';

  const labelElement = document.createElement('span');
  labelElement.textContent = label;

  link.appendChild(iconElement);
  link.appendChild(labelElement);

  document.getElementById('buttons').appendChild(link);
}

function showError(message) {
  document.getElementById('buttons').innerHTML = '';

  const messageElement = document.createElement('p');
  messageElement.className = 'loading';
  messageElement.textContent = message;

  document.getElementById('buttons').appendChild(messageElement);
}

function renderProfile(data) {
  if (!data || typeof data !== 'object') {
    showError('সঠিক তথ্য পাওয়া যায়নি।');
    return;
  }

  document.title = (data.title || 'ONLINE TV') + ' | Official';

  document.getElementById('title').textContent =
    String(data.title || 'ONLINE TV').replace(/:$/, '').trim();

  document.getElementById('tagline').textContent =
    data.tagline || '';

  const imageUrl = safeUrl(data.profileImage || data.logoText);

  if (imageUrl) {
    document.getElementById('profileImage').src = imageUrl;
  }

  document.getElementById('socials').innerHTML = '';

  ['facebook', 'instagram', 'youtube', 'whatsapp'].forEach(function(name) {
    addSocial(name, data[name]);
  });

  // সর্বশেষ YouTube ভিডিওর Thumbnail
  const videoUrl = safeUrl(data.latestVideoUrl || data.videoUrl);
  const videoId = videoUrl ? getYouTubeVideoId(videoUrl) : '';

  const videoSection = document.getElementById('videoSection');

  if (videoId) {
    document.getElementById('videoLink').href =
      'https://www.youtube.com/watch?v=' + videoId;

    document.getElementById('videoThumbnail').src =
      'https://i.ytimg.com/vi/' + videoId + '/hqdefault.jpg';

    videoSection.hidden = false;
  } else {
    videoSection.hidden = true;
  }

  // চারটি কাস্টম বাটন
  const buttons = document.getElementById('buttons');
  buttons.innerHTML = '';

  for (let i = 1; i <= 4; i++) {
    addButton(
      data['button' + i + 'Icon'],
      data['button' + i + 'Text'],
      data['button' + i + 'Url']
    );
  }

  if (!buttons.children.length) {
    showError('কাস্টম বাটন এখনো যোগ করা হয়নি।');
  }
}

function loadProfile() {
  const callbackName = 'onlineTVCallback_' + Date.now();

  let finished = false;
  const script = document.createElement('script');

  const timeout = setTimeout(function() {
    if (finished) return;

    finished = true;
    delete window[callbackName];
    script.remove();

    showError('তথ্য লোড হয়নি। আবার চেষ্টা করুন।');
  }, 20000);

  window[callbackName] = function(data) {
    if (finished) return;

    finished = true;
    clearTimeout(timeout);

    try {
      renderProfile(data);
    } catch (error) {
      console.error('Profile display error:', error);
      showError('প্রোফাইল দেখাতে সমস্যা হয়েছে।');
    }

    delete window[callbackName];
    script.remove();
  };

  script.onerror = function() {
    if (finished) return;

    finished = true;
    clearTimeout(timeout);
    delete window[callbackName];

    showError('Google Apps Script-এর সঙ্গে সংযোগ হয়নি।');
    script.remove();
  };

  script.src = APPS_SCRIPT_URL +
    '?callback=' + encodeURIComponent(callbackName) +
    '&t=' + Date.now();

  document.body.appendChild(script);
}

loadProfile();
</script>

</body>
</html>
