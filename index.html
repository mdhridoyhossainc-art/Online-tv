<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online TV - Official Bio Link</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b, #0f172a);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            padding: 30px 24px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff0055;
            padding: 3px;
            margin-bottom: 16px;
            box-shadow: 0 8px 16px rgba(255, 0, 85, 0.3);
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        p.bio {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 20px;
            border-radius: 14px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .link-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .link-btn i.icon {
            font-size: 20px;
            width: 30px;
            text-align: left;
        }

        .youtube { color: #ff0000; }
        .facebook { color: #1877f2; }
        .website { color: #00f2fe; }
        .contact { color: #25d366; }

        .footer {
            margin-top: 28px;
            font-size: 12px;
            color: #64748b;
        }

        .footer strong {
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- আপনার প্রোফাইল ছবি বা লোগোর লিংক এখানে বসবে -->
        <img src="https://via.placeholder.com/110" alt="Online TV Logo" class="profile-img">
        
        <h1>Online TV</h1>
        <p class="bio">Digital Media, Entertainment & News Platform</p>

        <div class="links-container">
            <!-- আপনার ইউটিউব চ্যানেল লিংক (oonlinetv420 হ্যান্ডেল সহ) -->
            <a href="https://www.youtube.com/@oonlinetv420" target="_blank" class="link-btn">
                <i class="fa-brands fa-youtube icon youtube"></i>
                <span>YouTube Channel</span>
                <i class="fa-solid fa-chevron-right"></i>
            </a>

            <!-- ফেসবুক পেজ লিংক -->
            <a href="https://facebook.com" target="_blank" class="link-btn">
                <i class="fa-brands fa-facebook icon facebook"></i>
                <span>Facebook Page</span>
                <i class="fa-solid fa-chevron-right"></i>
            </a>

            <!-- ওয়েবসাইট বা গিটহ্যাব পেজ লিংক -->
            <a href="https://mdhridoyhossainc-art.github.io/Online-tv/" target="_blank" class="link-btn">
                <i class="fa-solid fa-globe icon website"></i>
                <span>Official Website</span>
                <i class="fa-solid fa-chevron-right"></i>
            </a>

            <!-- হোয়াটসঅ্যাপ কন্টাক্ট লিংক -->
            <a href="https://wa.me/" target="_blank" class="link-btn">
                <i class="fa-brands fa-whatsapp icon contact"></i>
                <span>WhatsApp Contact</span>
                <i class="fa-solid fa-chevron-right"></i>
            </a>
        </div>

        <div class="footer">
            © 2026 <strong>Online TV</strong>. All Rights Reserved.
        </div>
    </div>

</body>
</html>
