<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online TV</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f0f0f;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 480px;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .profile-card {
      background: rgba(20, 20, 20, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 30px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .logo-circle {
      width: 90px;
      height: 90px;
      background: #e50914;
      border-radius: 50%;
      margin: 0 auto 15px auto;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      font-weight: bold;
      color: white;
      box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
    }
    h1 {
      font-size: 22px;
      margin: 10px 0;
    }
    p {
      font-size: 14px;
      color: #b3b3b3;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .social-links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 25px;
    }
    .btn {
      display: block;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: white;
      padding: 14px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .btn:hover {
      background: #e50914;
      border-color: #e50914;
      transform: translateY(-2px);
    }
    #video-container {
      margin: 20px 0;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="profile-card">
      <div class="logo-circle" id="logoText">TV</div>
      <h1 id="title">Online TV</h1>
      <p id="tagline">Loading...</p>
      
      <!-- Video Section -->
      <div id="video-container">
        <iframe id="featured-video" width="100%" height="200" src="" frameborder="0" allowfullscreen style="border-radius: 10px;"></iframe>
      </div>

      <div class="social-links">
        <a id="youtube-btn" href="#" target="_blank" class="btn" style="display:none;">YouTube</a>
        <a id="facebook-btn" href="#" target="_blank" class="btn" style="display:none;">Facebook</a>
        <a id="instagram-btn" href="#" target="_blank" class="btn" style="display:none;">Instagram</a>
        <a id="whatsapp-btn" href="#" target="_blank" class="btn" style="display:none;">WhatsApp</a>
      </div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzbSWPZ_qWmJSJ0HHwl4kRBbj2IWXYVorajlWRoBby88BpRFfF0823_k40JX0Cshsc/exec';

    async function loadSheetData() {
      if (!APPS_SCRIPT_URL) return;
      try {
        let res = await fetch(APPS_SCRIPT_URL);
        let data = await res.json();
        
        if (data.title) document.getElementById('title').innerText = data.title;
        if (data.tagline) document.getElementById('tagline').innerHTML = data.tagline.replace(/\n/g, '<br>');
        if (data.logoText) document.getElementById('logoText').innerText = data.logoText;
        
        if (data.youtube) {
          let ytBtn = document.getElementById('youtube-btn');
          ytBtn.href = data.youtube;
          ytBtn.style.display = 'block';
        }
        if (data.facebook) {
          let fbBtn = document.getElementById('facebook-btn');
          fbBtn.href = data.facebook;
          fbBtn.style.display = 'block';
        }
        if (data.instagram) {
          let igBtn = document.getElementById('instagram-btn');
          igBtn.href = data.instagram;
          igBtn.style.display = 'block';
        }
        if (data.whatsapp) {
          let waBtn = document.getElementById('whatsapp-btn');
          waBtn.href = data.whatsapp;
          waBtn.style.display = 'block';
        }
        if (data.videoUrl) {
          document.getElementById('featured-video').src = data.videoUrl;
          document.getElementById('video-container').style.display = 'block';
        }
      } catch (err) {
        console.error('Error loading data:', err);
      }
    }
    loadSheetData();
  </script>
</body>
</html>
