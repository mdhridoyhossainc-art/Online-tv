
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d18">
<title>ONLINE TV | Official Media Profile</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #080d18;
  --surface: #111a2b;
  --surface2: #172338;
  --red: #ff263f;
  --red2: #d9082d;
  --white: #f8fafc;
  --muted: #9ba9bd;
  --line: rgba(255,255,255,.09);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  font-family: 'Inter','Hind Siliguri',sans-serif;
  color: var(--white);
  background:
    radial-gradient(ellipse at 50% -10%, rgba(255,38,63,.16), transparent 42%),
    radial-gradient(ellipse at 100% 60%, rgba(31,78,130,.13), transparent 40%),
    var(--bg);
  padding: 35px 16px;
}

.container {
  width: 100%;
  max-width: 480px;
  margin: auto;
}

.topline {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
}

.brand {
  font-size: 15px;
  font-weight: 900;
  letter-spacing: 2px;
}

.brand span { color: var(--red); }

.live {
  display: flex;
  align-items: center;
  gap: 7px;
  color: #ff697a;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.5px;
}

.live-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--red);
  box-shadow: 0 0 12px var(--red);
}

.profile {
  text-align: center;
  padding: 30px 22px 25px;
  border: 1px solid var(--line);
  border-radius: 25px;
  background: linear-gradient(145deg,rgba(25,39,61,.96),rgba(12,19,32,.96));
  box-shadow: 0 25px 70px rgba(0,0,0,.32);
  position: relative;
  overflow: hidden;
}

.profile::before {
  content: "";
  position: absolute;
  width: 210px;
  height: 210px;
  background: rgba(255,38,63,.10);
  filter: blur(65px);
  border-radius: 50%;
  top: -120px;
  left: calc(50% - 105px);
}

.avatar-wrap {
  width: 116px;
  height: 116px;
  margin: 0 auto 20px;
  padding: 4px;
  border-radius: 50%;
  background: linear-gradient(135deg,#ff344d,#a70d2c,#ff8a99);
  box-shadow: 0 0 28px rgba(255,38,63,.23);
  position: relative;
}

.avatar {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  background: #18243a;
  border: 4px solid #111a2b;
}

.title {
  font-size: 29px;
  font-weight: 900;
  letter-spacing: 1px;
  line-height: 1.2;
}

.title span { color: var(--red); }

.tagline {
  margin-top: 12px;
  font-family: 'Hind Siliguri',sans-serif;
  color: #d2dbea;
  font-size: 14px;
  line-height: 1.8;
}

.verified {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 16px;
  padding: 7px 13px;
  border: 1px solid rgba(255,255,255,.11);
  border-radius: 30px;
  background: rgba(255,255,255,.045);
  color: #dbe6f5;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1.2px;
}

.verified svg { color: #ff5267; }

.section-title {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 28px 2px 14px;
  color: #f3f6fb;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 1.2px;
}

.section-title::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--line);
}

.socials {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 10px;
}

.social {
  min-width: 0;
  text-decoration: none;
  color: var(--white);
  background: linear-gradient(145deg,#17243a,#101a2b);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 15px 4px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 9px;
  transition: .25s ease;
}

.social:hover {
  transform: translateY(-4px);
  border-color: rgba(255,38,63,.55);
  background: #1c2940;
}

.social svg { width: 23px; height: 23px; }
.social span { font-size: 10px; font-weight: 700; }

.links {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.custom-link {
  min-height: 62px;
  padding: 12px 16px;
  border-radius: 15px;
  border: 1px solid rgba(255,255,255,.10);
  background: linear-gradient(105deg,#19263c,#111c2e);
  color: white;
  display: flex;
  align-items: center;
  gap: 14px;
  text-decoration: none;
  transition: .25s ease;
  box-shadow: 0 7px 18px rgba(0,0,0,.14);
}

.custom-link:hover {
  transform: translateX(4px);
  border-color: var(--red);
  background: linear-gradient(105deg,#26334a,#17243a);
}

.link-icon {
  width: 39px;
  height: 39px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: rgba(255,38,63,.13);
  color: #ff6175;
  font-size: 20px;
}

.link-text {
  flex: 1;
  min-width: 0;
  font-size: 14px;
  font-weight: 700;
  overflow-wrap: anywhere;
}

.arrow {
  color: #8494aa;
  font-size: 20px;
}

.video-card {
  border: 1px solid var(--line);
  border-radius: 17px;
  overflow: hidden;
  background: var(--surface);
}

.video-frame {
  position: relative;
  width: 100%;
  aspect-ratio: 16/9;
  background: #000;
}

.video-frame iframe {
  width: 100%;
  height: 100%;
  border: 0;
}

.footer {
  text-align: center;
  padding: 27px 10px 10px;
  color: #77869c;
  font-size: 11px;
  line-height: 2;
}

.footer strong {
  color: #e8edf5;
  letter-spacing: 1px;
}

.footer span { color: var(--red); }

@media(max-width:360px) {
  .title { font-size: 25px; }
  .socials { gap: 6px; }
  .social span { font-size: 9px; }
}
</style>
</head>

<body>
<div class="container">

  <div class="topline">
    <div class="brand">ONLINE <span>TV</span></div>
    <div class="live"><i class="live-dot"></i> DIGITAL MEDIA</div>
  </div>

  <section class="profile">
    <div class="avatar-wrap">
      <img id="profileImage" class="avatar" src="" alt="ONLINE TV">
    </div>

    <h1 class="title" id="title">ONLINE <span>TV</span></h1>
    <p class="tagline" id="tagline">সংবাদ • বিনোদন • মানুষের গল্প</p>

    <div class="verified">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M12 2l3 2 4-.2.8 3.8 2.2 3.4-2.2 3.4-.8 3.8-4-.2-3 2-3-2-4 .2-.8-3.8L2 11l2.2-3.4L5 3.8l4 .2z"/>
        <path d="m8 12 2.5 2.5L16 9"/>
      </svg>
      OFFICIAL MEDIA PROFILE
    </div>
  </section>

  <div class="section-title">CONNECT WITH US</div>

  <div class="socials" id="socials">
    <a class="social" id="facebook" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 21v-8h2.7l.4-3.1h-3.1v-2c0-.9.3-1.5 1.6-1.5h1.7V3.6c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2.1H7.3V13h2.8v8z"/></svg>
      <span>Facebook</span>
    </a>

    <a class="social" id="instagram" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="18" cy="6" r="1" fill="currentColor" stroke="none"/>
      </svg>
      <span>Instagram</span>
    </a>

    <a class="social" id="youtube" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M23 7a3 3 0 0 0-2.1-2.1C19 4.4 12 4.4 12 4.4s-7 0-8.9.5A3 3 0 0 0 1 7a31 31 0 0 0-.5 5 31 31 0 0 0 .5 5 3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5A3 3 0 0 0 23 17a31 31 0 0 0 .5-5 31 31 0 0 0-.5-5zM9.8 15.5v-7l6 3.5z"/></svg>
      <span>YouTube</span>
    </a>

    <a class="social" id="whatsapp" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 3.5A11.8 11.8 0 0 0 12.1 0C5.6 0 .3 5.3.3 11.8c0 2.1.5 4.1 1.6 5.9L.2 24l6.4-1.7a11.8 11.8 0 0 0 5.5 1.4h.1c6.5 0 11.8-5.3 11.8-11.8 0-3.2-1.2-6.2-3.5-8.4zM12.1 21.7a9.8 9.8 0 0 1-5-1.4l-.4-.2-3.8 1 1-3.7-.3-.5a9.7 9.7 0 0 1-1.5-5.1 9.9 9.9 0 1 1 10 9.9zm5.4-7.4c-.3-.2-1.7-.8-2-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-1 1.2-.2.2-.4.2-.7.1-.3-.2-1.2-.5-2.3-1.4-.9-.8-1.5-1.7-1.7-2-.2-.3 0-.5.1-.6l.5-.6c.2-.2.2-.4.3-.6.1-.2 0-.4 0-.6l-.9-2.1c-.2-.5-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.1 1.1-1.1 2.5s1.1 2.9 1.3 3.1c.1.2 2.2 3.4 5.3 4.7.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.7-.7 1.9-1.3.2-.6.2-1.1.2-1.3-.1-.1-.3-.2-.6-.4z"/></svg>
      <span>WhatsApp</span>
    </a>
  </div>

  <div class="section-title">EXPLORE ONLINE TV</div>
  <div class="links" id="customLinks"></div>

  <div class="section-title">LATEST VIDEO</div>
  <div class="video-card">
    <div class="video-frame" id="videoFrame"></div>
  </div>

  <footer class="footer">
    <strong>ONLINE <span>TV</span></strong><br>
    সংবাদ, বিনোদন ও মানুষের গল্পের বিশ্বস্ত ঠিকানা<br>
    © 2026 ONLINE TV. All Rights Reserved.
  </footer>

</div>

<script>
const APPS_SCRIPT_URL =
'https://script.google.com/macros/s/AKfycbzA5VHTZL0Izp_9yi3_eI99Ju0Fwz_Eb8KHYY-ENXR8GKbcfRL7uBDVu_yju_nBw4mX/exec';

const DEFAULT_VIDEO_ID = 'AepReMI-ecU';

function setSocial(id, url) {
  const el = document.getElementById(id);
  if (url && String(url).trim()) {
    el.href = url;
    el.style.display = 'flex';
  } else {
    el.style.display = 'none';
  }
}

function getVideoId(url) {
  if (!url) return DEFAULT_VIDEO_ID;
  const match = String(url).match(
    /(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]{11})/
  );
  return match ? match[1] : DEFAULT_VIDEO_ID;
}

function renderVideo(url) {
  const id = getVideoId(url);
  document.getElementById('videoFrame').innerHTML =
    '<iframe src="https://www.youtube-nocookie.com/embed/' +
    encodeURIComponent(id) +
    '" title="ONLINE TV Latest Video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe>';
}

function renderButtons(data) {
  const container = document.getElementById('customLinks');
  container.innerHTML = '';

  for (let i = 1; i <= 4; i++) {
    const text = data['button' + i + 'Text'];
    const url = data['button' + i + 'Url'];
    const icon = data['button' + i + 'Icon'] || '↗';

    if (!text || !url) continue;

    const a = document.createElement('a');
    a.className = 'custom-link';
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener';

    const iconBox = document.createElement('span');
    iconBox.className = 'link-icon';
    iconBox.textContent = icon;

    const label = document.createElement('span');
    label.className = 'link-text';
    label.textContent = text;

    const arrow = document.createElement('span');
    arrow.className = 'arrow';
    arrow.textContent = '↗';

    a.append(iconBox, label, arrow);
    container.appendChild(a);
  }
}

function applyProfile(data) {
  if (!data || data.error) return;

  const title = data.title || 'ONLINE TV';
  const titleEl = document.getElementById('title');
  titleEl.textContent = title;

  const tagline = data.tagline || 'সংবাদ • বিনোদন • মানুষের গল্প';
  document.getElementById('tagline').textContent = tagline;

  const image = data.profileImage || data.logoText || '';
  const avatar = document.getElementById('profileImage');

  if (image && /^https?:\/\//i.test(String(image))) {
    avatar.src = image;
  } else {
    avatar.src = 'https://placehold.co/300x300/172338/ffffff?text=ONLINE+TV';
  }

  setSocial('facebook', data.facebook);
  setSocial('instagram', data.instagram);
  setSocial('youtube', data.youtube);
  setSocial('whatsapp', data.whatsapp);

  renderButtons(data);
  renderVideo(data.latestVideoUrl || data.videoUrl);
}

function loadProfile() {
  const cached = localStorage.getItem('onlineTVProfileCache');

  if (cached) {
    try { applyProfile(JSON.parse(cached)); } catch(e) {}
  }

  const callbackName = 'onlineTVCallback_' + Date.now();

  window[callbackName] = function(data) {
    try {
      applyProfile(data);
      localStorage.setItem('onlineTVProfileCache', JSON.stringify(data));
    } catch(e) {
      console.error('Profile error:', e);
    }
    delete window[callbackName];
    script.remove();
  };

  const script = document.createElement('script');
  script.src = APPS_SCRIPT_URL +
    '?callback=' + callbackName +
    '&_=' + Date.now();

  script.onerror = function() {
    console.error('Profile connection failed.');
    delete window[callbackName];
    script.remove();
  };

  document.body.appendChild(script);
}

loadProfile();
</script>
</body>
</html>
