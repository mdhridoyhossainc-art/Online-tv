
<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ONLINE TV | Official</title>
<meta name="description" content="সংবাদ, বিনোদন ও মানুষের গল্পের বিশ্বস্ত ঠিকানা।">

<style>
:root {
  --accent:#e5092b;
  --accent2:#ff3155;
  --glow:rgba(229,9,43,.42);
  --panel:rgba(45,0,12,.48);
  --surface:rgba(100,0,25,.20);
  --border:rgba(255,145,165,.55);
  --text:#fff;
  --muted:#ffe7ed;
  --footer:#ffe8ed;
  --page1:#050505;
  --page2:#240008;
  --page3:#080000;
  --shadow:rgba(0,0,0,.42);
}

*{box-sizing:border-box}

html{min-height:100%;background:#100003}

body{
  position:relative;
  isolation:isolate;
  margin:0;
  min-height:100vh;
  min-height:100svh;
  padding:22px 13px;
  color:var(--text);
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:
    radial-gradient(ellipse at 12% 12%,var(--glow),transparent 48%),
    radial-gradient(ellipse at 90% 28%,rgba(255,255,255,.10),transparent 38%),
    radial-gradient(ellipse at 50% 100%,var(--glow),transparent 50%),
    linear-gradient(135deg,var(--page1),var(--page2) 48%,var(--page3));
  background-attachment:scroll;
  transition:background .35s ease,color .35s ease;
}

body::before{
  content:"";
  position:fixed;
  inset:-25%;
  z-index:-1;
  pointer-events:none;
  background:
    radial-gradient(ellipse at 18% 22%,rgba(255,255,255,.22),transparent 22%),
    radial-gradient(ellipse at 80% 30%,var(--glow),transparent 30%),
    radial-gradient(ellipse at 45% 78%,rgba(255,255,255,.10),transparent 28%);
  filter:blur(35px);
  animation:ambientGlow 10s ease-in-out infinite alternate;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  opacity:.22;
  background:linear-gradient(125deg,transparent 20%,rgba(255,255,255,.12) 20.2%,transparent 20.8%,transparent 68%,rgba(255,255,255,.08) 68.2%,transparent 69%);
}

@keyframes ambientGlow{
  from{opacity:.55;transform:scale(1)}
  to{opacity:1;transform:scale(1.08)}
}

/* MAIN GLASS PROFILE PANEL */

.container{
  position:relative;
  isolation:isolate;
  overflow:hidden;
  width:100%;
  max-width:480px;
  min-height:500px;
  margin:0 auto;
  padding:18px 15px 17px;
  display:flex;
  flex-direction:column;
  align-items:center;
  border:1.5px solid var(--border);
  border-radius:27px;
  background:
    linear-gradient(135deg,rgba(255,255,255,.17),transparent 24%,transparent 72%,rgba(255,255,255,.08)),
    var(--panel);
  box-shadow:
    inset 0 1px 8px rgba(255,255,255,.24),
    inset 0 -8px 22px rgba(0,0,0,.16),
    0 0 0 2px var(--glow),
    0 0 30px var(--glow),
    0 18px 45px var(--shadow);
  backdrop-filter:blur(20px) saturate(145%);
  -webkit-backdrop-filter:blur(20px) saturate(145%);
}

.container::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  pointer-events:none;
  border-radius:inherit;
  background:
    linear-gradient(130deg,rgba(255,255,255,.22),transparent 22%,transparent 65%,rgba(255,255,255,.10)),
    radial-gradient(ellipse at 50% 0%,var(--glow),transparent 60%);
}

.container::after{
  content:"";
  position:absolute;
  left:4%;
  right:4%;
  bottom:12px;
  height:2px;
  pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  box-shadow:0 0 12px var(--glow);
}

/* PROFILE IMAGE: RAINBOW RING REMAINS FIXED */

.profile{
  position:relative;
  isolation:isolate;
  flex:none;
  width:112px;
  height:112px;
  padding:4px;
  border-radius:50%;
  background:conic-gradient(#ff3155,#ff9b36,#ffe45e,#25d8a0,#28a8ff,#173b60,#ff3155);
  box-shadow:0 0 18px rgba(255,65,100,.45),0 0 35px rgba(40,145,220,.30),0 0 55px rgba(15,55,100,.30);
  animation:ringGlow 4s ease-in-out infinite alternate;
}

.profile img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  border-radius:50%;
  border:3px solid #111;
  background:#191919;
}

@keyframes ringGlow{
  to{box-shadow:0 0 24px rgba(255,65,100,.6),0 0 42px rgba(40,145,220,.4),0 0 60px rgba(15,55,100,.35)}
}

/* TITLE */

h1{
  margin:8px 0 5px;
  font-size:27px;
  font-weight:800;
  letter-spacing:1.5px;
  text-align:center;
  text-shadow:0 0 18px var(--glow);
}

.tagline{
  max-width:400px;
  margin:0 0 17px;
  color:var(--muted);
  font-size:14px;
  line-height:1.8;
  text-align:center;
}

/* SOCIAL ICONS: BRAND COLORS FIXED */

.socials{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:17px;
  margin-bottom:20px;
}

.socials a{
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.32);
  border-radius:50%;
  background:rgba(255,255,255,.12);
  box-shadow:inset 0 1px 5px rgba(255,255,255,.20),0 5px 16px rgba(0,0,0,.25);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  transition:transform .25s ease;
}

.socials a:hover{transform:translateY(-4px) scale(1.08)}
.socials svg{width:25px;height:25px;display:block}
.socials a.social-facebook{background:#1877F2}
.socials a.social-instagram{background:linear-gradient(35deg,#FFD600,#FF7A00,#FF0169,#7638FA)}
.socials a.social-youtube{background:#FF0033}
.socials a.social-whatsapp{background:#25D366}
.socials a.social-facebook svg,.socials a.social-youtube svg,.socials a.social-whatsapp svg{fill:#fff}

/* LATEST VIDEO */

.video-section{width:100%;margin-bottom:20px}
.section-label{
  margin:0 0 10px;
  color:var(--text);
  font-size:15px;
  font-weight:700;
  text-align:center;
  text-shadow:0 0 12px var(--glow);
}
.section-label::before{content:"▶ ";color:var(--accent)}
.video-box{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  overflow:hidden;
  background:linear-gradient(145deg,var(--accent),#080000);
  border:1.5px solid var(--border);
  border-radius:19px;
  box-shadow:inset 0 1px 6px rgba(255,255,255,.18),0 0 0 2px var(--glow),0 0 25px var(--glow),0 10px 32px rgba(0,0,0,.35);
}
.video-box::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:2;
  border:1px solid rgba(255,255,255,.22);
  border-radius:inherit;
  pointer-events:none;
}
.video-link{position:absolute;inset:0;display:block;color:white;text-decoration:none}
.video-thumbnail{width:100%;height:100%;display:block;object-fit:cover}
.play-button{
  position:absolute;
  left:50%;
  top:50%;
  width:58px;
  height:58px;
  display:flex;
  align-items:center;
  justify-content:center;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:linear-gradient(145deg,rgba(255,255,255,.32),rgba(255,255,255,.07) 45%,rgba(20,0,8,.32));
  border:1px solid rgba(255,255,255,.68);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  box-shadow:inset 0 1px 2px rgba(255,255,255,.55);
}
.play-button::after{
  content:"";
  margin-left:4px;
  border-top:10px solid transparent;
  border-bottom:10px solid transparent;
  border-left:16px solid #fff;
}
.video-caption{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:24px 12px 9px;
  background:linear-gradient(transparent,rgba(0,0,0,.78));
  font-size:10px;
  letter-spacing:1px;
  text-align:center;
}

/* CUSTOM BUTTONS */

.buttons{width:100%;display:flex;flex-direction:column;gap:13px}

.action-btn{
  position:relative;
  isolation:isolate;
  overflow:hidden;
  width:100%;
  min-height:68px;
  padding:12px 62px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff!important;
  text-align:center;
  text-decoration:none;
  font-size:16px;
  font-weight:700;
  letter-spacing:.3px;
  background:var(--surface)!important;
  border:1px solid var(--border);
  border-radius:19px;
  backdrop-filter:blur(15px) saturate(140%);
  -webkit-backdrop-filter:blur(15px) saturate(140%);
  box-shadow:inset 0 1px 7px rgba(255,255,255,.16),0 6px 18px rgba(0,0,0,.16);
  transition:background .25s,border-color .25s;
}
.action-btn::before{
  content:"";
  position:absolute;
  inset:1px;
  z-index:-1;
  border-radius:18px;
  background:linear-gradient(135deg,rgba(255,255,255,.17),rgba(255,255,255,.025) 42%,transparent 75%);
  pointer-events:none;
}
.action-btn::after{
  content:"";
  position:absolute;
  top:-80%;
  left:-65%;
  width:35%;
  height:260%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);
  transform:rotate(24deg);
  transition:left .75s;
  pointer-events:none;
}
.action-btn:hover::after{left:130%}
.action-btn:hover{border-color:rgba(255,255,255,.75)}
.btn-icon{
  position:absolute;
  left:15px;
  width:44px;
  height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:transparent!important;
  border:0!important;
  box-shadow:none!important;
}
.btn-icon svg{width:42px;height:42px;display:block}
.btn-icon-facebook svg .facebook-circle{fill:#1877F2}
.btn-icon-facebook svg .facebook-letter{fill:#fff}
.btn-icon-youtube svg{fill:#FF0033}
.btn-icon-whatsapp svg{fill:#25D366}
.btn-label{position:relative;z-index:2;color:inherit!important}

/* FOOTER */

.footer{margin-top:23px;text-align:center}
.footer strong{display:block;color:var(--footer);font-size:10px;font-weight:700;letter-spacing:2px}
.footer small{display:block;margin-top:5px;color:var(--accent2);font-size:8px;letter-spacing:2px}

/* LOADING */

.loading{padding:10px;color:var(--muted);font-size:12px;text-align:center}

/* =========================================
   SEVEN DISTINCT THEME DESIGNS
   ========================================= */

/* 1. DEFAULT BLUE */

body[data-theme="default-blue"]{
  --accent:#087cff;
  --accent2:#26baff;
  --glow:rgba(0,110,255,.42);
  --panel:rgba(3,29,67,.62);
  --surface:rgba(0,83,180,.25);
  --border:rgba(105,185,255,.70);
  --muted:#e2f2ff;
  --footer:#f0f8ff;
  --page1:#030914;--page2:#092b59;--page3:#020712;
}

/* 2. PROFESSIONAL RED */

body[data-theme="professional-red"]{
  --accent:#ff172e;
  --accent2:#ff5366;
  --glow:rgba(255,20,40,.42);
  --panel:rgba(55,0,8,.62);
  --surface:rgba(150,0,20,.23);
  --border:rgba(255,105,115,.72);
  --muted:#ffe7e9;
  --footer:#fff0f0;
  --page1:#100306;--page2:#570b12;--page3:#100204;
}

/* 3. GREEN FRESH */

body[data-theme="green-fresh"]{
  --accent:#08c45b;
  --accent2:#45ed8c;
  --glow:rgba(0,200,90,.42);
  --panel:rgba(0,43,23,.64);
  --surface:rgba(0,125,55,.24);
  --border:rgba(95,240,155,.70);
  --muted:#e3ffed;
  --footer:#effff4;
  --page1:#020d08;--page2:#07502b;--page3:#020b06;
}

/* 4. PURPLE ELEGANT */

body[data-theme="purple-elegant"]{
  --accent:#9229ee;
  --accent2:#c47aff;
  --glow:rgba(155,55,255,.44);
  --panel:rgba(40,9,69,.65);
  --surface:rgba(115,35,185,.24);
  --border:rgba(210,155,255,.72);
  --muted:#f5e9ff;
  --footer:#fff2ff;
  --page1:#0b0612;--page2:#38105b;--page3:#09040f;
}

/* 5. ORANGE PREMIUM */

body[data-theme="orange-premium"]{
  --accent:#ff7900;
  --accent2:#ffb04a;
  --glow:rgba(255,125,0,.43);
  --panel:rgba(60,27,0,.66);
  --surface:rgba(160,70,0,.25);
  --border:rgba(255,190,105,.75);
  --muted:#fff0dc;
  --footer:#fff4e5;
  --page1:#100801;--page2:#59300a;--page3:#100600;
}

/* 6. LIGHT WHITE */

body[data-theme="light-white"]{
  --accent:#e5092b;
  --accent2:#ff3155;
  --glow:rgba(95,115,145,.25);
  --panel:rgba(255,255,255,.72);
  --surface:rgba(255,255,255,.62);
  --border:rgba(255,255,255,.95);
  --text:#171b22;
  --muted:#343c49;
  --footer:#252b35;
  --page1:#dce4ef;--page2:#fff;--page3:#d7e0ed;
}

/* 7. BLACK GLASS */

body[data-theme="black-glass"]{
  --accent:#aebdce;
  --accent2:#e0e8f2;
  --glow:rgba(175,195,220,.28);
  --panel:rgba(12,16,23,.72);
  --surface:rgba(120,135,155,.15);
  --border:rgba(205,220,240,.52);
  --muted:#e1e7ef;
  --footer:#f0f3f8;
  --page1:#020304;--page2:#252b35;--page3:#030405;
}

/* THEME-SPECIFIC EXTRA VISUALS */

body[data-theme="default-blue"] .container{
  background:linear-gradient(135deg,rgba(130,195,255,.22),transparent 28%,rgba(0,40,110,.20)),var(--panel);
}
body[data-theme="professional-red"] .container{
  background:linear-gradient(135deg,rgba(255,150,155,.22),transparent 28%,rgba(100,0,15,.25)),var(--panel);
}
body[data-theme="green-fresh"] .container{
  background:linear-gradient(135deg,rgba(150,255,190,.20),transparent 28%,rgba(0,70,35,.24)),var(--panel);
}
body[data-theme="purple-elegant"] .container{
  background:linear-gradient(135deg,rgba(220,175,255,.22),transparent 28%,rgba(65,0,100,.24)),var(--panel);
}
body[data-theme="orange-premium"] .container{
  background:linear-gradient(135deg,rgba(255,210,145,.22),transparent 28%,rgba(105,45,0,.25)),var(--panel);
}
body[data-theme="black-glass"] .container{
  background:linear-gradient(135deg,rgba(255,255,255,.13),transparent 30%,rgba(100,115,135,.12)),var(--panel);
}

/* LIGHT THEME TEXT AND SURFACES */

body[data-theme="light-white"] .tagline{color:#343c49}
body[data-theme="light-white"] .section-label{color:#202630;text-shadow:none}
body[data-theme="light-white"] .action-btn{
  color:#202630!important;
  background:rgba(255,255,255,.68)!important;
  border-color:rgba(100,115,135,.35);
  box-shadow:inset 0 1px 7px rgba(255,255,255,.9),0 6px 18px rgba(40,55,75,.10);
}
body[data-theme="light-white"] .btn-label{color:#202630!important}
body[data-theme="light-white"] .action-btn::before{
  background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(255,255,255,.22) 45%,transparent 75%);
}
body[data-theme="light-white"] .socials a{
  border-color:rgba(255,255,255,.8);
  box-shadow:0 4px 15px rgba(30,45,65,.18);
}
body[data-theme="light-white"] .footer strong{color:#252b35}
body[data-theme="light-white"] .footer small{color:#68768a}
body[data-theme="light-white"] .loading{color:#343c49}
body[data-theme="light-white"] .container{
  box-shadow:inset 0 1px 8px #fff,0 0 0 1px rgba(255,255,255,.9),0 15px 40px rgba(35,50,70,.20);
}

/* RESPONSIVE */

@media(min-width:700px){
  body{padding-top:32px}
  .container{padding:22px 18px 19px}
  .profile{width:120px;height:120px}
  h1{font-size:30px}
}
@media(max-width:380px){
  body{padding:12px 10px}
  .container{padding:15px 12px;border-radius:23px}
  h1{font-size:24px}
  .tagline{font-size:13px}
  .action-btn{min-height:63px;padding:10px 54px;font-size:14px}
  .btn-icon{left:12px;width:40px;height:40px}
  .btn-icon svg{width:38px;height:38px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>

<script>

const DEFAULTS={

const THEMES=[
 'default-blue','professional-red','green-fresh',
 'purple-elegant','orange-premium','light-white','black-glass'

function safeUrl(value){
  try{
    const u=new URL(String(value||'').trim());
    return ['https:','http:'].includes(u.protocol)?u.href:'';
  }catch(e){return ''}
}

function getVideoId(value){
  try{
    const u=new URL(value);
    let id='';
    if(u.hostname.includes('youtu.be')) id=u.pathname.split('/').filter(Boolean)[0]||'';
    else if(/^\/(shorts|embed|live)\//.test(u.pathname)) id=u.pathname.split('/')[2]||'';
    else id=u.searchParams.get('v')||'';
    return /^[\w-]{11}$/.test(id)?id:'';
  }catch(e){return ''}
}

function setTheme(value){
  const theme=THEMES.includes(String(value||'').trim())
    ?String(value).trim():'professional-red';
  document.body.dataset.theme=theme;
}

function addSocial(name,url){
  const valid=safeUrl(url);

  a.className='social-'+name;
  a.href=valid;
  a.target='_blank';
  a.rel='noopener noreferrer';
  a.setAttribute('aria-label',name);
  const svg={

    instagram:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="#fff" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="#fff" stroke-width="2"/><circle cx="17.5" cy="6.8" r="1.2" fill="#fff"/></svg>',
    youtube:'<svg viewBox="0 0 24 24"><path fill="#fff" d="M23 7a3 3 0 0 0-2.1-2.1C19 4.4 12 4.4 12 4.4s-7 0-8.9.5A3 3 0 0 0 1 7a31 31 0 0 0-.5 5 31 31 0 0 0 .5 5 3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5A3 3 0 0 0 23 17a31 31 0 0 0 .5-5 31 31 0 0 0-.5-5zM9.6 15.5v-7l6 3.5z"/></svg>',
    whatsapp:'<svg viewBox="0 0 24 24"><path fill="#fff" d="M12 2a9.8 9.8 0 0 0-8.4 14.8L2 22l5.4-1.5A9.8 9.8 0 1 0 12 2zm0 17.8a8 8 0 0 1-4.1-1.1l-.3-.2-3.2.9.9-3.1-.2-.3A8 8 0 1 1 12 19.8z"/></svg>'
  };
  a.innerHTML=svg[name]||'';
  document.getElementById('socials').appendChild(a);

function renderSocials(data){
  const node=document.getElementById('socials');
  node.innerHTML='';
  ['facebook','instagram','youtube','whatsapp'].forEach(name=>{
    addSocial(name,safeUrl(data[name])||DEFAULTS[name]);
  });
}

function brandFor(label,url){
  let host='';
  try{host=new URL(url).hostname.toLowerCase()}catch(e){}
  const s=(String(label||'')+' '+String(url||'')).toLowerCase();
  if(host.includes('facebook.com')||s.includes('facebook'))return'facebook';
  if(host.includes('instagram.com')||s.includes('instagram'))return'instagram';
  if(host.includes('youtube.com')||host.includes('youtu.be')||s.includes('youtube'))return'youtube';
  if(host.includes('wa.me')||host.includes('whatsapp.com')||s.includes('whatsapp'))return'whatsapp';
  return'';
}

function iconMarkup(brand){
  if(brand==='facebook')return '<svg viewBox="0 0 48 48"><circle class="facebook-circle" cx="24" cy="24" r="23"/><path class="facebook-letter" d="M27.2 41V26.1h5l.8-5.8h-5.8v-3.7c0-1.7.5-2.9 2.9-2.9h3.1V8.5c-.5-.1-2.4-.2-4.5-.2-4.5 0-7.6 2.7-7.6 7.8v4.2H16v5.8h5.1V41h6.1z"/></svg>';
  if(brand==='youtube')return '<svg viewBox="0 0 24 24"><path fill="#FF0033" d="M23 7a3 3 0 0 0-2.1-2.1C19 4.4 12 4.4 12 4.4s-7 0-8.9.5A3 3 0 0 0 1 7a31 31 0 0 0-.5 5 31 31 0 0 0 .5 5 3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5A3 3 0 0 0 23 17a31 31 0 0 0 .5-5 31 31 0 0 0-.5-5zM9.6 15.5v-7l6 3.5z"/></svg>';
  if(brand==='whatsapp')return '<svg viewBox="0 0 24 24"><path fill="#25D366" d="M12 2a9.8 9.8 0 0 0-8.4 14.8L2 22l5.4-1.5A9.8 9.8 0 1 0 12 2zm0 17.8a8 8 0 0 1-4.1-1.1l-.3-.2-3.2.9.9-3.1-.2-.3A8 8 0 1 1 12 19.8z"/></svg>';
  if(brand==='instagram')return '<svg viewBox="0 0 24 24"><defs><linearGradient id="igCustom" x1="3" y1="21" x2="21" y2="3"><stop stop-color="#FFD600"/><stop offset=".32" stop-color="#FF7A00"/><stop offset=".65" stop-color="#FF0169"/><stop offset="1" stop-color="#7638FA"/></linearGradient></defs><rect x="2" y="2" width="20" height="20" rx="6" fill="url(#igCustom)"/><rect x="6" y="6" width="12" height="12" rx="3.5" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="12" cy="12" r="3" fill="none" stroke="#fff" stroke-width="1.8"/></svg>';
  return'';
}

function addButton(label,url,icon){
  const valid=safeUrl(url);
  if(!valid||!String(label||'').trim())return;
  const a=document.createElement('a');
  a.className='action-btn';
  a.href=valid;
  a.target='_blank';
  a.rel='noopener noreferrer';
  const brand=brandFor(label,valid);
  const iconNode=document.createElement('span');
  iconNode.className='btn-icon'+(brand==='facebook'?' btn-icon-facebook':'');
  iconNode.innerHTML=iconMarkup(brand);
  if(!brand)iconNode.textContent=icon||'🔗';
  const text=document.createElement('span');
  text.className='btn-label';
  text.textContent=label;
  a.append(iconNode,text);
  document.getElementById('buttons').appendChild(a);
}

function renderButtons(data){
  const node=document.getElementById('buttons');
  node.innerHTML='';
  for(let i=1;i<=4;i++){
    addButton(
      data['button'+i+'Text'],
      data['button'+i+'Url'],
      data['button'+i+'Icon']
    );
  }
  if(!node.children.length){
    addButton('Facebook',DEFAULTS.facebook,'');
    addButton('Instagram',DEFAULTS.instagram,'');
    addButton('YouTube',DEFAULTS.youtube,'');
    addButton('WhatsApp',DEFAULTS.whatsapp,'');
  }
}

function renderVideo(data){
  const url=safeUrl(data&&(data.latestVideoUrl||data.videoUrl));
  if(url)currentLatestVideoUrl=url;
  const id=getVideoId(currentLatestVideoUrl)||DEFAULT_VIDEO_ID;
  const link=document.getElementById('videoLink');
  const img=document.getElementById('videoThumbnail');
  const section=document.getElementById('videoSection');
  section.hidden=false;
  link.href=currentLatestVideoUrl||('https://www.youtube.com/watch?v='+id);
  if(link.dataset.videoId===id)return;
  link.dataset.videoId=id;
  const sources=[
    'https://img.youtube.com/vi/'+id+'/maxresdefault.jpg',
    'https://img.youtube.com/vi/'+id+'/hqdefault.jpg',
    'https://img.youtube.com/vi/'+id+'/mqdefault.jpg',
    'https://img.youtube.com/vi/'+id+'/default.jpg'
  ];
  let index=0;
  img.onerror=()=>{
    index++;
    if(index<sources.length)img.src=sources[index];
    else img.onerror=null;
  };
  img.src=sources[0];
}

function renderProfile(data){
  if(!data||typeof data!=='object'||data.error)return;

  setTheme(data.selectedTheme||data.theme);

  const title=String(data.title||DEFAULTS.title).replace(/:$/,'').trim();
  document.title=title+' | Official';
  const titleNode=document.getElementById('title');
  if(title.toUpperCase()==='ONLINE TV'){
    titleNode.innerHTML='<span style="color:#fff">ONLINE</span> <span style="color:#ff3155">TV</span>';
  }else titleNode.textContent=title;

  document.getElementById('tagline').textContent=data.tagline||DEFAULTS.tagline;

  /* Sheet-এ profileImage না থাকলে URL-যুক্ত logoText-ও ব্যবহার করবে */
  const imageUrl=safeUrl(data.profileImage)||safeUrl(data.logoText)||DEFAULT_IMAGE;
  const image=document.getElementById('profileImage');
  if(image.src!==imageUrl)image.src=imageUrl;
  image.onerror=()=>{image.onerror=null;image.src=DEFAULT_IMAGE};

  renderSocials(data);
  renderButtons(data);
  renderVideo(data);
}

function jsonp(url,callbackName,timeoutMs,onSuccess,onFailure){
  const script=document.createElement('script');
  let finished=false;
  const timer=setTimeout(()=>finish(false),timeoutMs);

  function finish(ok,data){
    if(finished)return;
    finished=true;
    clearTimeout(timer);
    delete window[callbackName];
    script.remove();
    if(ok)onSuccess(data);
    else if(onFailure)onFailure();
  }

  window[callbackName]=data=>finish(true,data);
  script.onerror=()=>finish(false);
  script.src=url;
  document.body.appendChild(script);
}

/* PROFILE LOAD: CACHE FIRST, SERVER SECOND */

function loadProfile(){
  if(profileBusy)return;
  profileBusy=true;

  const key='onlineTVProfileCache';
  let cached=false;

  try{
    const old=JSON.parse(localStorage.getItem(key)||'null');
    if(old&&typeof old==='object'){
      if(old.latestVideoUrl)currentLatestVideoUrl=safeUrl(old.latestVideoUrl);
      renderProfile(old);
      cached=true;
    }
  }catch(e){}

  const cb='onlineTVProfile_'+Date.now()+'_'+Math.random().toString(36).slice(2);
  jsonp(
    APPS_SCRIPT_URL+'?callback='+encodeURIComponent(cb)+'&t='+Date.now(),
    cb,
    10000,
    data=>{
      profileBusy=false;
      if(data&&!data.error){
        if(currentLatestVideoUrl)data.latestVideoUrl=currentLatestVideoUrl;
        renderProfile(data);
        try{localStorage.setItem(key,JSON.stringify(data))}catch(e){}
      }
    },
    ()=>{
      profileBusy=false;
      /* আগে থেকেই HTML-এ প্রোফাইল দৃশ্যমান; error হলে খালি করবে না */
    }
  );
}

/* LATEST VIDEO LOADS SEPARATELY IN BACKGROUND */

function loadLatestVideo(){
  if(videoBusy)return;
  videoBusy=true;
  const cb='onlineTVVideo_'+Date.now()+'_'+Math.random().toString(36).slice(2);
  jsonp(
    APPS_SCRIPT_URL+'?action=latestVideo&callback='+encodeURIComponent(cb)+'&t='+Date.now(),
    cb,
    12000,
    data=>{
      videoBusy=false;
      const url=data&&safeUrl(data.latestVideoUrl);
      if(url){
        currentLatestVideoUrl=url;
        renderVideo({latestVideoUrl:url});
        try{
          const saved=JSON.parse(localStorage.getItem('onlineTVProfileCache')||'{}');
          saved.latestVideoUrl=url;
          localStorage.setItem('onlineTVProfileCache',JSON.stringify(saved));
        }catch(e){}
      }
    },
    ()=>{videoBusy=false}
  );
}

/* INITIAL VIEW IS ALREADY VISIBLE; NO WAITING SCREEN */

setTheme('professional-red');

loadLatestVideo();

setInterval(()=>{
