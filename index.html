<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#120006">
<title>ONLINE TV | Official</title>
<meta name="description" content="সংবাদ, বিনোদন ও মানুষের গল্পের বিশ্বস্ত ঠিকানা।">

<style>
:root {
  --red: #e5092b;
  --burgundy: #35000d;
  --black: #050505;
}

* { box-sizing: border-box; }

html {
  min-height: 100%;
  background-color: #100003;
}

body {
  position: relative;
  isolation: isolate;
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  padding: 38px 16px 22px;
  color: #fff;
  background:
    radial-gradient(ellipse at 15% 15%, rgba(180,0,35,.35), transparent 48%),
    radial-gradient(ellipse at 85% 25%, rgba(110,0,20,.28), transparent 48%),
    radial-gradient(ellipse at 50% 100%, rgba(130,0,25,.22), transparent 50%),
    linear-gradient(135deg, #050505, #240008 48%, #080000);
  background-attachment: scroll;
  font-family: Arial, "Noto Sans Bengali", sans-serif;
}

body::before {
  content: "";
  position: fixed;
  inset: -20%;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(circle at 20% 25%, rgba(220,0,45,.16), transparent 32%),
    radial-gradient(circle at 80% 35%, rgba(130,0,25,.18), transparent 32%),
    radial-gradient(circle at 50% 85%, rgba(180,0,35,.12), transparent 35%);
  filter: blur(35px);
  animation: backgroundGlow 10s ease-in-out infinite alternate;
}

@keyframes backgroundGlow {
  from { opacity: .65; transform: scale(1); }
  to { opacity: 1; transform: scale(1.08); }
}

.container {
  width: 100%;
  max-width: 480px;
  margin: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* PROFILE IMAGE */

.profile {
  position: relative;
  isolation: isolate;
  width: 112px;
  height: 112px;
  padding: 4px;
  border-radius: 50%;
  background: conic-gradient(
    #ff3155, #ff9b36, #ffe45e, #25d8a0,
    #28a8ff, #173b60, #ff3155
  );
  box-shadow:
    0 0 18px rgba(255,65,100,.45),
    0 0 35px rgba(40,145,220,.30),
    0 0 55px rgba(15,55,100,.30);
  animation: neonGlow 4s ease-in-out infinite alternate;
}

.profile img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  border-radius: 50%;
  border: 3px solid #111;
  background: #191919;
}

@keyframes neonGlow {
  from {
    box-shadow:
      0 0 14px rgba(255,65,100,.35),
      0 0 30px rgba(40,145,220,.25),
      0 0 45px rgba(15,55,100,.22);
  }
  to {
    box-shadow:
      0 0 24px rgba(255,65,100,.60),
      0 0 42px rgba(40,145,220,.40),
      0 0 60px rgba(15,55,100,.35);
  }
}

/* TITLE */

h1 {
  margin: 17px 0 7px;
  font-size: 27px;
  font-weight: 800;
  letter-spacing: 1.5px;
  text-align: center;
  text-shadow: 0 0 18px rgba(255,60,100,.25);
}

.tagline {
  max-width: 400px;
  margin: 0 0 19px;
  color: #ffe7ed;
  font-size: 14px;
  line-height: 1.8;
  text-align: center;
}

/* SOCIAL ICONS */

.socials {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 19px;
  margin-bottom: 27px;
}

.socials a {
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(
    145deg,
    rgba(125,0,42,.75),
    rgba(7,0,10,.92)
  );
  border: 1px solid rgba(255,145,165,.48);
  border-radius: 50%;
  transition: .25s ease;
  box-shadow:
    inset 0 1px 5px rgba(255,255,255,.20),
    inset 0 -2px 5px rgba(0,0,0,.20),
    0 5px 16px rgba(0,0,0,.30),
    0 0 13px rgba(255,0,65,.18);
  backdrop-filter: blur(12px) saturate(145%);
  -webkit-backdrop-filter: blur(12px) saturate(145%);
}

.socials svg {
  width: 23px;
  height: 23px;
  display: block;
}

.socials a.social-facebook { color: #1877F2; }
.socials a.social-facebook svg { fill: #1877F2; }

.socials a.social-instagram {
  color: #fff;
  background: linear-gradient(
    145deg,
    rgba(125,0,42,.75),
    rgba(7,0,10,.92)
  );
  border-color: rgba(255,145,165,.48);
}

.socials a.social-youtube { color: #FF0033; }
.socials a.social-youtube svg { fill: #FF0033; }

.socials a.social-whatsapp { color: #25D366; }
.socials a.social-whatsapp svg { fill: #25D366; }

.socials a:hover {
  transform: translateY(-4px) scale(1.09);
  border-color: rgba(255,255,255,.80);
  box-shadow:
    inset 0 1px 5px rgba(255,255,255,.22),
    0 0 20px currentColor,
    0 6px 18px rgba(0,0,0,.30);
}

/* LATEST VIDEO */

.video-section {
  width: 100%;
  margin-bottom: 25px;
}

.section-label {
  margin: 0 0 12px;
  color: #ffe8bd;
  font-size: 11px;
  letter-spacing: 2px;
  text-align: center;
  text-shadow: 0 0 12px rgba(255,190,75,.35);
}

.video-box {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  background: linear-gradient(145deg, #650020, #080000);
  border: 1.5px solid rgba(255,155,175,.62);
  border-radius: 20px;
  box-shadow:
    inset 0 1px 6px rgba(255,255,255,.18),
    inset 0 -3px 10px rgba(0,0,0,.25),
    0 0 0 2px rgba(255,0,65,.16),
    0 0 25px rgba(255,0,65,.25),
    0 10px 32px rgba(0,0,0,.40);
  transition: .3s ease;
}

.video-box::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 2;
  border: 1px solid rgba(255,190,205,.25);
  border-radius: inherit;
  pointer-events: none;
}

.video-box:hover {
  border-color: rgba(255,190,200,.85);
  box-shadow:
    inset 0 1px 5px rgba(255,255,255,.20),
    0 0 0 2px rgba(255,0,65,.22),
    0 0 30px rgba(255,0,65,.35),
    0 12px 38px rgba(0,0,0,.45);
}

.video-link {
  position: absolute;
  inset: 0;
  display: block;
  text-decoration: none;
  color: white;
}

.video-thumbnail {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  transition: transform .4s ease;
}

.video-link:hover .video-thumbnail {
  transform: scale(1.04);
}

/* GLASS PLAY ICON */

.play-button {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 58px;
  height: 58px;
  display: flex;
  align-items: center;
  justify-content: center;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: linear-gradient(
    145deg,
    rgba(255,255,255,.28),
    rgba(255,255,255,.07) 45%,
    rgba(20,0,8,.32)
  );
  border: 1px solid rgba(255,255,255,.68);
  backdrop-filter: blur(16px) saturate(160%);
  -webkit-backdrop-filter: blur(16px) saturate(160%);
  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.55),
    inset 0 -1px 3px rgba(0,0,0,.12);
  transition: .25s ease;
}

.play-button::before {
  content: "";
  position: absolute;
  inset: 3px;
  border-radius: 50%;
  background: linear-gradient(
    135deg,
    rgba(255,255,255,.30),
    transparent 55%
  );
  pointer-events: none;
}

.play-button::after {
  content: "";
  position: relative;
  z-index: 1;
  margin-left: 4px;
  border-top: 10px solid transparent;
  border-bottom: 10px solid transparent;
  border-left: 16px solid #fff;
  filter: drop-shadow(0 1px 1px rgba(0,0,0,.18));
}

.video-link:hover .play-button {
  transform: translate(-50%, -50%) scale(1.09);
  background: linear-gradient(
    145deg,
    rgba(255,255,255,.38),
    rgba(255,255,255,.12) 50%,
    rgba(20,0,8,.28)
  );
}

.video-caption {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 25px 12px 10px;
  background: linear-gradient(transparent, rgba(0,0,0,.8));
  font-size: 11px;
  letter-spacing: 1px;
  text-align: center;
}

/* BUTTONS */

.buttons {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 17px;
}

.action-btn {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  width: 100%;
  min-height: 80px;
  padding: 15px 68px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #FFFFFF !important;
  text-align: center;
  text-decoration: none;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: .45px;
  background: rgba(100,0,20,.12) !important;
  border: 1px solid rgba(255,255,255,.35);
  border-radius: 21px;
  backdrop-filter: blur(14px) saturate(130%);
  -webkit-backdrop-filter: blur(14px) saturate(130%);
  box-shadow: none !important;
  text-shadow: none !important;
  transition: background .3s ease, border-color .3s ease;
}

.action-btn::before {
  content: "";
  position: absolute;
  inset: 1px;
  z-index: 0;
  border-radius: 20px;
  background: linear-gradient(
    135deg,
    rgba(255,255,255,.12),
    rgba(255,255,255,.025) 35%,
    transparent 70%
  );
  pointer-events: none;
}

.action-btn::after {
  content: "";
  position: absolute;
  top: -80%;
  left: -65%;
  width: 35%;
  height: 260%;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.12),
    transparent
  );
  transform: rotate(24deg);
  transition: left .75s ease;
}

.action-btn:hover::after { left: 130%; }

.action-btn:hover {
  background: rgba(100,0,20,.18) !important;
  border-color: rgba(255,255,255,.48);
}

/* BRAND ICONS */

.btn-icon {
  position: absolute;
  z-index: 2;
  left: 19px;
  width: 50px;
  height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent !important;
  border: 0 !important;
}

.btn-icon svg {
  width: 46px;
  height: 46px;
  display: block;
}

.btn-icon-facebook svg { fill: none; }
.btn-icon-facebook svg .facebook-circle { fill: #1877F2; }
.btn-icon-facebook svg .facebook-letter { fill: #FFFFFF; }

.btn-icon-youtube svg { fill: #FF0033; }
.btn-icon-whatsapp svg { fill: #25D366; }

.btn-label {
  position: relative;
  z-index: 2;
  color: #FFFFFF !important;
}

/* FOOTER */

.footer {
  margin-top: 36px;
  text-align: center;
}

.footer strong {
  display: block;
  color: #ffe8ed;
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 3px;
}

.footer small {
  display: block;
  margin-top: 5px;
  color: #ff5275;
  font-size: 7px;
  letter-spacing: 2px;
}

.loading {
  padding: 18px;
  color: #ffe0e7;
  font-size: 13px;
  text-align: center;
}

/* 6টি থিম স্টাইল (আগের লেআউট ও ডিজাইন ১০০% ঠিক রেখে) */

body[data-theme="default-blue"] {
  background: radial-gradient(ellipse at 15% 15%, rgba(0,92,210,.35), transparent 48%), linear-gradient(135deg,#05070c,#071a35 48%,#03060c);
}
body[data-theme="default-blue"] .socials a, body[data-theme="default-blue"] .action-btn {

}

body[data-theme="green-fresh"] {

}
body[data-theme="green-fresh"] .socials a, body[data-theme="green-fresh"] .action-btn {
  background: rgba(0,100,55,.16) !important;

body[data-theme="green-fresh"] .video-box {

}

body[data-theme="purple-elegant"] {
  background: radial-gradient(ellipse at 15% 15%,rgba(115,45,210,.34),transparent 48%), linear-gradient(135deg,#07050b,#211035 48%,#08040d);
}
body[data-theme="purple-elegant"] .socials a, body[data-theme="purple-elegant"] .action-btn {
  background: rgba(85,35,145,.17) !important;
  border-color: rgba(195,155,255,.44);
}
body[data-theme="purple-elegant"] .video-box {
  background: linear-gradient(145deg,#45206e,#090511);
  border-color: rgba(195,155,255,.62);
}

body[data-theme="orange-premium"] {
  background: radial-gradient(ellipse at 15% 15%,rgba(190,90,0,.34),transparent 48%), linear-gradient(135deg,#090603,#2b1605 48%,#090501);
}
body[data-theme="orange-premium"] .socials a, body[data-theme="orange-premium"] .action-btn {
  background: rgba(125,55,0,.17) !important;
  border-color: rgba(255,190,120,.44);
}
body[data-theme="orange-premium"] .video-box {
  background: linear-gradient(145deg,#6b3508,#100800);
  border-color: rgba(255,190,120,.62);
}

body[data-theme="light-white"] {
  color: #20242b;
  background: radial-gradient(ellipse at 15% 15%,rgba(255,255,255,.95),transparent 48%), linear-gradient(135deg,#ffffff,#edf1f7 48%,#ffffff);
}
body[data-theme="light-white"] .tagline { color: #424b59; }
body[data-theme="light-white"] .section-label { color: #555e6c; text-shadow: none; }
body[data-theme="light-white"] .action-btn, body[data-theme="light-white"] .socials a {
  color: #252b35 !important;
  background: rgba(255,255,255,.82) !important;
  border-color: rgba(90,105,125,.32);
}
body[data-theme="light-white"] .btn-label { color: #252b35 !important; }
body[data-theme="light-white"] .video-box {
  background: linear-gradient(145deg,#dce2eb,#aab4c3);
  border-color: rgba(90,105,125,.48);
}
body[data-theme="light-white"] .footer strong { color: #333d4c; }
body[data-theme="light-white"] .footer small { color: #68768a; }
body[data-theme="light-white"] .loading { color: #424b59; }
</style>
</head>

<body>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzA5VHTZL0Izp_9yi3_eI99Ju0Fwz_Eb8KHYY-ENXR8GKbcfRL7uBDVu_yju_nBw4mX/exec';
const DEFAULT_VIDEO_ID = 'AepReMI-ecU';
let currentLatestVideoUrl = '';

function makeInstagramSVG() {
  return `<svg viewBox="0 0 24 24"><defs><linearGradient id="igG" x1="3" y1="21" x2="21" y2="3" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFD600"/><stop offset=".32" stop-color="#FF7A00"/><stop offset=".65" stop-color="#FF0169"/><stop offset="1" stop-color="#7638FA"/></linearGradient></defs><rect x="2" y="2" width="20" height="20" rx="6" fill="url(#igG)"/><rect x="6" y="6" width="12" height="12" rx="3.5" fill="none" stroke="#FFFFFF" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="none" stroke="#FFFFFF" stroke-width="2"/><circle cx="16.3" cy="7.8" r="1.15" fill="#FFFFFF"/></svg>`;
}

const socialIcons = {
  facebook: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#1877F2"/><path fill="#FFFFFF" d="M13.5 21v-8h2.7l.4-3h-3.1V8.1c0-.9.3-1.5 1.6-1.5h1.6V3.9c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3V10H7.2v3h2.8v8z"/></svg>`,
  instagram: makeInstagramSVG(),
  youtube: `<svg viewBox="0 0 24 24"><path d="M23 7a3 3 0 0 0-2.1-2.1C19 4.4 12 4.4 12 4.4s-7 0-8.9.5A3 3 0 0 0 1 7a31 31 0 0 0-.5 5 31 31 0 0 0 .5 5 3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5A3 3 0 0 0 23 17a31 31 0 0 0 .5-5 31 31 0 0 0-.5-5z" fill="#FF0033"/><path d="m9.6 8.5 6 3.5-6 3.5z" fill="#FFFFFF"/></svg>`,
  whatsapp: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#25D366"/><path d="M12 4.2a7.7 7.7 0 0 0-6.6 11.7l-.9 3.1 3.2-.9A7.7 7.7 0 1 0 12 4.2zm0 13.9a6.2 6.2 0 0 1-3.2-.9l-.2-.1-1.9.5.5-1.8-.1-.2A6.2 6.2 0 1 1 12 18.1zm3.4-4.6c-.2-.1-1.2-.6-1.4-.7-.2-.1-.3-.1-.4.1-.1.2-.5.7-.7.8-.1.1-.2.2-.4.1-.2-.1-.9-.3-1.6-1-.6-.5-1-1.1-1.1-1.3-.1-.2 0-.3.1-.4l.3-.4.2-.3c.1-.1 0-.2 0-.3l-.6-1.4c-.2-.4-.3-.4-.5-.4h-.4c-.1 0-.3.1-.5.2-.2.2-.7.7-.7 1.6s.7 1.8.8 2c.1.1 1.4 2.1 3.2 2.9 1.2.5 1.7.5 2.2.4.3 0 1.2-.5 1.4-.9.2-.4.2-.8.1-.9-.1-.1-.2-.1-.4-.2z" fill="#FFFFFF"/></svg>`
};

function safeUrl(val) {
  try { const u = new URL(String(val || '').trim()); return ['https:','http:'].includes(u.protocol) ? u.href : ''; } catch(e) { return ''; }
}

function getYouTubeVideoId(val) {
  try {
    const u = new URL(val);
    let id = u.hostname.includes('youtu.be') ? u.pathname.split('/')[1] : u.searchParams.get('v') || u.pathname.split('/')[2] || '';
    return /^[a-zA-Z0-9_-]{11}$/.test(id) ? id : '';
  } catch(e) { return ''; }
}

function addSocial(name, url) {
  const vUrl = safeUrl(url);
  if (!vUrl || !socialIcons[name]) return;
  const link = document.createElement('a');
  link.className = 'social-' + name; link.href = vUrl; link.target = '_blank'; link.rel = 'noopener noreferrer';
  link.innerHTML = socialIcons[name];
  document.getElementById('socials').appendChild(link);
}

function addButton(icon, label, url) {
  const vUrl = safeUrl(url);
  if (!vUrl || !String(label || '').trim()) return;
  const link = document.createElement('a');
  link.className = 'action-btn'; link.href = vUrl; link.target = '_blank'; link.rel = 'noopener noreferrer';
  
  const iconEl = document.createElement('span');
  iconEl.className = 'btn-icon';
  if(url.includes('facebook') || label.toLowerCase().includes('facebook')) {
    iconEl.innerHTML = `<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="23" fill="#1877F2"/><path fill="#FFF" d="M27.2 41V26.1h5l.8-5.8h-5.8v-3.7c0-1.7.5-2.9 2.9-2.9h3.1V8.5c-.5-.1-2.4-.2-4.5-.2-4.5 0-7.6 2.7-7.6 7.8v4.2H16v5.8h5.1V41h6.1z"/></svg>`;
  } else if(url.includes('instagram') || label.toLowerCase().includes('instagram')) {
    iconEl.innerHTML = makeInstagramSVG();
  } else if(socialIcons[detectBrand(label, vUrl)]) {
    iconEl.innerHTML = socialIcons[detectBrand(label, vUrl)];
  } else {
    iconEl.textContent = icon || '🔗';
  }

  const lblEl = document.createElement('span');
  lblEl.className = 'btn-label'; lblEl.textContent = label;
  link.appendChild(iconEl); link.appendChild(lblEl);
  document.getElementById('buttons').appendChild(link);
}

function detectBrand(label, url) {
  const text = (label + ' ' + url).toLowerCase();
  if(text.includes('facebook')) return 'facebook';
  if(text.includes('instagram')) return 'instagram';
  if(text.includes('whatsapp')) return 'whatsapp';
  if(text.includes('youtube')) return 'youtube';
  return '';
}

function showError(msg) {
  const b = document.getElementById('buttons');
  b.innerHTML = `<p class="loading">${msg}</p>`;
}

function renderVideo(data) {
  const sUrl = safeUrl(data && (data.latestVideoUrl || data.videoUrl));
  if (sUrl) currentLatestVideoUrl = sUrl;
  const videoId = getYouTubeVideoId(currentLatestVideoUrl) || DEFAULT_VIDEO_ID;
  const vSec = document.getElementById('videoSection');
  const thumb = document.getElementById('videoThumbnail');
  const vLink = document.getElementById('videoLink');

  vLink.href = currentLatestVideoUrl || 'https://www.youtube.com/watch?v=' + videoId;
  vSec.hidden = false;
  thumb.src = 'https://img.youtube.com/vi/' + videoId + '/hqdefault.jpg';
}

function applySelectedTheme(themeName) {
  const themes = ['default-blue', 'professional-red', 'green-fresh', 'purple-elegant', 'orange-premium', 'light-white'];
  const t = themes.includes(themeName) ? themeName : 'professional-red';
  document.body.setAttribute('data-theme', t);
}

function renderProfile(data) {
  if (!data || data.error) { showError('সঠিক তথ্য পাওয়া যায়নি।'); return; }
  applySelectedTheme(data.selectedTheme);
  document.title = (data.title || 'ONLINE TV') + ' | Official';
  document.getElementById('title').textContent = data.title || 'ONLINE TV';
  document.getElementById('tagline').textContent = data.tagline || '';
  
  const imgUrl = safeUrl(data.profileImage);
  if (imgUrl) document.getElementById('profileImage').src = imgUrl;

  document.getElementById('socials').innerHTML = '';
  ['facebook', 'instagram', 'youtube', 'whatsapp'].forEach(n => addSocial(n, data[n]));
  renderVideo(data);

  const buttons = document.getElementById('buttons');
  buttons.innerHTML = '';
  for (let i = 1; i <= 4; i++) {
    addButton(data['button'+i+'Icon'], data['button'+i+'Text'], data['button'+i+'Url']);
  }
  if (!buttons.children.length) showError('কাস্টম বাটন এখনো যোগ করা হয়নি।');
}

function loadProfile() {
  const cb = 'cb_' + Math.random().toString(36).slice(2);
  window[cb] = function(data) {
    renderProfile(data);
    delete window[cb];
    script.remove();
  };
  const script = document.createElement('script');
  script.src = APPS_SCRIPT_URL + '?callback=' + encodeURIComponent(cb) + '&t=' + Date.now();
  document.body.appendChild(script);
}

loadProfile();
</script>
</body>
