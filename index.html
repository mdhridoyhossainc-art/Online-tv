
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#120006">
<title>ONLINE TV | Official</title>
<meta name="description" content="সংবাদ, বিনোদন ও মানুষের গল্পের বিশ্বস্ত ঠিকানা।">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>

<style>
:root {
  --red: #e5092b;
  --burgundy: #35000d;
  --black: #050505;
}

* { box-sizing: border-box; }

html {
  min-height: 100%;
  background-color: #100003;
}

body {
  position: relative;
  isolation: isolate;
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  padding: 38px 16px 22px;
  color: #fff;
  background:
    radial-gradient(ellipse at 15% 15%, rgba(180,0,35,.35), transparent 48%),
    radial-gradient(ellipse at 85% 25%, rgba(110,0,20,.28), transparent 48%),
    radial-gradient(ellipse at 50% 100%, rgba(130,0,25,.22), transparent 50%),
    linear-gradient(135deg, #050505, #240008 48%, #080000);
  background-attachment: scroll;
  font-family: Arial, "Noto Sans Bengali", sans-serif;
}

body::before {
  content: "";
  position: fixed;
  inset: -20%;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(circle at 20% 25%, rgba(220,0,45,.16), transparent 32%),
    radial-gradient(circle at 80% 35%, rgba(130,0,25,.18), transparent 32%),
    radial-gradient(circle at 50% 85%, rgba(180,0,35,.12), transparent 35%);
  filter: blur(35px);
  animation: backgroundGlow 10s ease-in-out infinite alternate;
}

@keyframes backgroundGlow {
  from { opacity: .65; transform: scale(1); }
  to { opacity: 1; transform: scale(1.08); }
}

.container {
  width: 100%;
  max-width: 480px;
  margin: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* PROFILE IMAGE */

.profile {
  position: relative;
  isolation: isolate;
  width: 112px;
  height: 112px;
  padding: 4px;
  border-radius: 50%;
  background: conic-gradient(
    #ff3155, #ff9b36, #ffe45e, #25d8a0,
    #28a8ff, #173b60, #ff3155
  );
  box-shadow:
    0 0 18px rgba(255,65,100,.45),
    0 0 35px rgba(40,145,220,.30),
    0 0 55px rgba(15,55,100,.30);
  animation: neonGlow 4s ease-in-out infinite alternate;
}

.profile img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  border-radius: 50%;
  border: 3px solid #111;
  background: #191919;
}

@keyframes neonGlow {
  from {
    box-shadow:
      0 0 14px rgba(255,65,100,.35),
      0 0 30px rgba(40,145,220,.25),
      0 0 45px rgba(15,55,100,.22);
  }
  to {
    box-shadow:
      0 0 24px rgba(255,65,100,.60),
      0 0 42px rgba(40,145,220,.40),
      0 0 60px rgba(15,55,100,.35);
  }
}

/* TITLE */

h1 {
  margin: 17px 0 7px;
  font-size: 27px;
  font-weight: 800;
  letter-spacing: 1.5px;
  text-align: center;
  text-shadow: 0 0 18px rgba(255,60,100,.25);
}

.tagline {
  max-width: 400px;
  margin: 0 0 19px;
  color: #ffe7ed;
  font-size: 14px;
  line-height: 1.8;
  text-align: center;
}

/* SOCIAL ICONS */

.socials {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 19px;
  margin-bottom: 27px;
}

.socials a {
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(
    145deg,
    rgba(125,0,42,.75),
    rgba(7,0,10,.92)
  );
  border: 1px solid rgba(255,145,165,.48);
  border-radius: 50%;
  transition: .25s ease;
  box-shadow:
    inset 0 1px 5px rgba(255,255,255,.20),
    inset 0 -2px 5px rgba(0,0,0,.20),
    0 5px 16px rgba(0,0,0,.30),
    0 0 13px rgba(255,0,65,.18);
  backdrop-filter: blur(12px) saturate(145%);
  -webkit-backdrop-filter: blur(12px) saturate(145%);
}

.socials svg {
  width: 23px;
  height: 23px;
  display: block;
}

.socials a.social-facebook { color: #1877F2; }
.socials a.social-facebook svg { fill: #1877F2; }

.socials a.social-instagram {
  width: 42px !important;
  height: 42px !important;
  min-width: 42px;
  min-height: 42px;
  padding: 0 !important;
  flex: 0 0 42px;
  border-radius: 50% !important;
}

.socials a.social-instagram svg {
  width: 23px !important;
  height: 23px !important;
  min-width: 23px;
  min-height: 23px;
  flex: 0 0 23px;
  display: block;
}

.socials a.social-youtube { color: #FF0033; }
.socials a.social-youtube svg { fill: #FF0033; }

.socials a.social-whatsapp { color: #25D366; }
.socials a.social-whatsapp svg { fill: #25D366; }

.socials a:hover {
  transform: translateY(-4px) scale(1.09);
  border-color: rgba(255,255,255,.80);
  box-shadow:
    inset 0 1px 5px rgba(255,255,255,.22),
    0 0 20px currentColor,
    0 6px 18px rgba(0,0,0,.30);
}

/* LATEST VIDEO */

.video-section {
  width: 100%;
  margin-bottom: 25px;
}

.section-label {
  margin: 0 0 12px;
  color: #ffe8bd;
  font-size: 11px;
  letter-spacing: 2px;
  text-align: center;
  text-shadow: 0 0 12px rgba(255,190,75,.35);
}

.video-box {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  background: linear-gradient(145deg, #650020, #080000);
  border: 1.5px solid rgba(255,155,175,.62);
  border-radius: 20px;
  box-shadow:
    inset 0 1px 6px rgba(255,255,255,.18),
    inset 0 -3px 10px rgba(0,0,0,.25),
    0 0 0 2px rgba(255,0,65,.16),
    0 0 25px rgba(255,0,65,.25),
    0 10px 32px rgba(0,0,0,.40);
  transition: .3s ease;
}

.video-box::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 2;
  border: 1px solid rgba(255,190,205,.25);
  border-radius: inherit;
  pointer-events: none;
}

.video-box:hover {
  border-color: rgba(255,190,200,.85);
  box-shadow:
    inset 0 1px 5px rgba(255,255,255,.20),
    0 0 0 2px rgba(255,0,65,.22),
    0 0 30px rgba(255,0,65,.35),
    0 12px 38px rgba(0,0,0,.45);
}

.video-link {
  position: absolute;
  inset: 0;
  display: block;
  text-decoration: none;
  color: white;
}

.video-thumbnail {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  transition: transform .4s ease;
}

.video-link:hover .video-thumbnail {
  transform: scale(1.04);
}

.play-button {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 58px;
  height: 58px;
  display: flex;
  align-items: center;
  justify-content: center;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: linear-gradient(
    145deg,
    rgba(255,255,255,.28),
    rgba(255,255,255,.07) 45%,
    rgba(20,0,8,.32)
  );
  border: 1px solid rgba(255,255,255,.68);
  backdrop-filter: blur(16px) saturate(160%);
  -webkit-backdrop-filter: blur(16px) saturate(160%);
  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.55),
    inset 0 -1px 3px rgba(0,0,0,.12);
  transition: .25s ease;
}

.play-button::before {
  content: "";
  position: absolute;
  inset: 3px;
  border-radius: 50%;
  background: linear-gradient(
    135deg,
    rgba(255,255,255,.30),
    transparent 55%
  );
  pointer-events: none;
}

.play-button::after {
  content: "";
  position: relative;
  z-index: 1;
  margin-left: 4px;
  border-top: 10px solid transparent;
  border-bottom: 10px solid transparent;
  border-left: 16px solid #fff;
  filter: drop-shadow(0 1px 1px rgba(0,0,0,.18));
}

.video-link:hover .play-button {
  transform: translate(-50%, -50%) scale(1.09);
  background: linear-gradient(
    145deg,
    rgba(255,255,255,.38),
    rgba(255,255,255,.12) 50%,
    rgba(20,0,8,.28)
  );
}

.video-caption {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 25px 12px 10px;
  background: linear-gradient(transparent, rgba(0,0,0,.8));
  font-size: 11px;
  letter-spacing: 1px;
  text-align: center;
}

/* PREMIUM RED GLASS BUTTONS */

.buttons {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 17px;
}

.action-btn {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  width: 100%;
  min-height: 80px;
  padding: 15px 68px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #FFFFFF !important;
  text-align: center;
  text-decoration: none;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: .45px;
  background: rgba(100, 0, 20, 0.12) !important;
  border: 1px solid rgba(255, 255, 255, 0.35);
  border-radius: 21px;
  backdrop-filter: blur(14px) saturate(130%);
  -webkit-backdrop-filter: blur(14px) saturate(130%);
  box-shadow: none !important;
  text-shadow: none !important;
  transition: background .3s ease, border-color .3s ease;
}

.action-btn::before {
  content: "";
  position: absolute;
  inset: 1px;
  z-index: 0;
  border-radius: 20px;
  background: linear-gradient(
    135deg,
    rgba(255, 255, 255, 0.12),
    rgba(255, 255, 255, 0.025) 35%,
    transparent 70%
  );
  pointer-events: none;
}

.action-btn::after {
  content: "";
  position: absolute;
  top: -80%;
  left: -65%;
  width: 35%;
  height: 260%;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.12),
    transparent
  );
  transform: rotate(24deg);
  transition: left .75s ease;
}

.action-btn:hover::after { left: 130%; }

.action-btn:hover {
  background: rgba(100, 0, 20, 0.18) !important;
  border-color: rgba(255,255,255,.48);
  box-shadow: none !important;
  text-shadow: none !important;
  transform: none;
}

.action-btn:active {
  transform: none;
  box-shadow: none !important;
}

/* BRAND ICONS */

.btn-icon {
  position: absolute;
  z-index: 2;
  left: 19px;
  width: 50px;
  height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent !important;
  border: 0 !important;
  border-radius: 0;
  box-shadow: none !important;
  text-shadow: none !important;
  transition: none;
}

.btn-icon svg {
  width: 46px;
  height: 46px;
  display: block;
  opacity: 1;
  filter: none;
  box-shadow: none !important;
}

/* FACEBOOK - UNCHANGED */

.btn-icon-facebook svg { fill: none; }
.btn-icon-facebook svg .facebook-circle { fill: #1877F2; }
.btn-icon-facebook svg .facebook-letter { fill: #FFFFFF; }

/* OTHER BRAND COLOURS */

.btn-icon-youtube svg { fill: #FF0033; }
.btn-icon-whatsapp svg { fill: #25D366; }

.btn-icon-instagram svg {
  opacity: 1;
  filter: none;
}

/* INSTAGRAM - ONLY ADD ROUND BACKGROUND */

.btn-icon-instagram {
  background: linear-gradient(
    145deg,
    rgba(125,0,42,.75),
    rgba(7,0,10,.92)
  ) !important;
  border: 1px solid rgba(255,145,165,.48) !important;
  border-radius: 50% !important;
  box-shadow:
    inset 0 1px 5px rgba(255,255,255,.20),
    inset 0 -2px 5px rgba(0,0,0,.20),
    0 5px 16px rgba(0,0,0,.30) !important;
}

/* WHATSAPP - ONLY ADD ROUND BACKGROUND */

.btn-icon-whatsapp {
  background: #075E54 !important;
  border: 1px solid rgba(255,255,255,.35) !important;
  border-radius: 50% !important;
  box-shadow:
    inset 0 1px 5px rgba(255,255,255,.20),
    0 5px 16px rgba(0,0,0,.30) !important;
}

.btn-icon::after {
  content: none !important;
  display: none !important;
}

/* HOVER - KEEP BRAND BACKGROUNDS */

.action-btn:hover .btn-icon {
  transform: none;
}

.action-btn:hover .btn-icon-instagram {
  background: linear-gradient(
    145deg,
    rgba(125,0,42,.75),
    rgba(7,0,10,.92)
  ) !important;
}

.action-btn:hover .btn-icon-whatsapp {
  background: #075E54 !important;
}

/* BUTTON LABEL */

.btn-label {
  position: relative;
  z-index: 2;
  color: #FFFFFF !important;
  text-shadow: none !important;
}

/* FOOTER */

.footer {
  margin-top: 36px;
  text-align: center;
}

.footer strong {
  display: block;
  color: #ffe8ed;
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 3px;
}

.footer small {
  display: block;
  margin-top: 5px;
  color: #ff5275;
  font-size: 7px;
  letter-spacing: 2px;
}

/* LOADING */

.loading {
  padding: 18px;
  color: #ffe0e7;
  font-size: 13px;
  text-align: center;
}

/* FIRST VISIT LOADING ANIMATION */

body.profile-loading .container {
  position: fixed;
  inset: 0;
  width: 100%;
  max-width: none;
  min-height: 100svh;
  justify-content: center;
  pointer-events: none;
}

body.profile-loading .container > :not(.profile) {
  display: none !important;
}

body.profile-loading .profile img {
  visibility: hidden;
}

/* RESPONSIVE */

@media (min-width: 700px) {
  body { padding-top: 48px; }
  .profile { width: 120px; height: 120px; }
  h1 { font-size: 30px; }
}

@media (max-width: 380px) {
  body {
    padding-left: 13px;
    padding-right: 13px;
  }

  h1 { font-size: 24px; }
  .buttons { gap: 14px; }

  .action-btn {
    min-height: 73px;
    padding: 13px 58px;
    font-size: 14px;
    border-radius: 19px;
  }

  .btn-icon {
    width: 43px;
    height: 43px;
    left: 15px;
  }

  .btn-icon svg {
    width: 40px;
    height: 40px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}

/* SELECTABLE COLOR THEMES */

body[data-theme="default-blue"] {
  background:
    radial-gradient(ellipse at 15% 15%, rgba(0,92,210,.35), transparent 48%),
    radial-gradient(ellipse at 85% 25%, rgba(0,55,145,.28), transparent 48%),
    radial-gradient(ellipse at 50% 100%, rgba(0,85,190,.22), transparent 50%),
    linear-gradient(135deg, #05070c, #071a35 48%, #03060c);
}
body[data-theme="default-blue"]::before {
  background:
    radial-gradient(circle at 20% 25%, rgba(0,115,255,.16), transparent 32%),
    radial-gradient(circle at 80% 35%, rgba(0,75,190,.18), transparent 32%),

}

}

}

    radial-gradient(circle at 20% 25%, rgba(255,255,255,.16), transparent 32%),

}

    linear-gradient(135deg, #020304, #171a20 48%, #030405);
}
body[data-theme="black-glass"]::before {
  background:
    radial-gradient(circle at 20% 25%, rgba(210,220,235,.12), transparent 32%),
    radial-gradient(circle at 80% 35%, rgba(135,145,160,.14), transparent 32%),
    radial-gradient(circle at 50% 85%, rgba(185,195,210,.09), transparent 35%);
}

/* THEME GLASS SURFACES */

}

body[data-theme="orange-premium"] .action-btn {

}

}

body[data-theme="light-white"] .socials a,
body[data-theme="light-white"] .action-btn {
  background: rgba(245,248,255,.14) !important;

}

}

body[data-theme="black-glass"] .action-btn {

<body class="profile-loading">
<main class="container">

  <div class="profile">
    <img id="profileImage" src="" alt="ONLINE TV">
  </div>

  <h1 id="title">ONLINE TV</h1>

  <p class="tagline" id="tagline">
    সংবাদ • বিনোদন • মানুষের গল্প
  </p>

  <nav class="socials" id="socials"></nav>

  <section class="video-section" id="videoSection" hidden>
    <p class="section-label">LATEST VIDEO</p>

    <div class="video-box">
      <a id="videoLink"
         class="video-link"
         href="https://www.youtube.com/@oonlinetb420"
         target="_blank"
         rel="noopener noreferrer"
         aria-label="ONLINE TV YouTube চ্যানেলে যান">

        <img id="videoThumbnail"
             class="video-thumbnail"
             src=""
             alt="ONLINE TV Latest Video">

        <span class="play-button"></span>
        <span class="video-caption">VISIT OUR YOUTUBE CHANNEL</span>
      </a>
    </div>
  </section>

  <section class="buttons" id="buttons">
    <div class="loading">তথ্য লোড হচ্ছে...</div>
  </section>

  <footer class="footer">
    <strong>ONLINE TV OFFICIAL</strong>
    <small>DIGITAL MEDIA PLATFORM</small>
  </footer>

</main>

<script>
const APPS_SCRIPT_URL =
'https://script.google.com/macros/s/AKfycbzA5VHTZL0Izp_9yi3_eI99Ju0Fwz_Eb8KHYY-ENXR8GKbcfRL7uBDVu_yju_nBw4mX/exec';

const DEFAULT_VIDEO_ID = 'AepReMI-ecU';

const YOUTUBE_CHANNEL_URL =
'https://www.youtube.com/@oonlinetb420';

/* INSTAGRAM SVG: COLOURFUL BRAND GLYPH */

function makeInstagramSVG(id) {
  const gradientId = id + '-gradient';

  return `
  <svg viewBox="0 0 24 24" fill="none"
       xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="${gradientId}"
        x1="3" y1="21" x2="21" y2="3"
        gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#FFD600"/>
        <stop offset=".32" stop-color="#FF7A00"/>
        <stop offset=".65" stop-color="#FF0169"/>
        <stop offset="1" stop-color="#7638FA"/>
      </linearGradient>
    </defs>
    <rect x="3" y="3" width="18" height="18" rx="5"
          stroke="url(#${gradientId})" stroke-width="2"/>
    <circle cx="12" cy="12" r="4"
            stroke="url(#${gradientId})" stroke-width="2"/>
    <circle cx="17.5" cy="6.5" r="1"
            fill="url(#${gradientId})"/>
  </svg>`;
}

/* INSTAGRAM BUTTON SVG */

function makeInstagramButtonSVG() {
  return `
  <svg viewBox="0 0 24 24"
       xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="instagramGradientButton"
        x1="3" y1="21" x2="21" y2="3"
        gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#FFD600"/>
        <stop offset=".32" stop-color="#FF7A00"/>
        <stop offset=".65" stop-color="#FF0169"/>
        <stop offset="1" stop-color="#7638FA"/>
      </linearGradient>
    </defs>
    <rect x="2" y="2" width="20" height="20" rx="6"
          fill="url(#instagramGradientButton)"/>
    <rect x="6" y="6" width="12" height="12" rx="3.5"
          fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
    <circle cx="12" cy="12" r="3"
            fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
    <circle cx="16.3" cy="7.8" r="1.1" fill="#FFFFFF"/>
  </svg>`;
}

/* SOCIAL ICONS */

const socialIcons = {
  facebook: `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <circle cx="12" cy="12" r="12" fill="#1877F2"/>
    <path fill="#FFFFFF" d="M13.5 21v-8h2.7l.4-3h-3.1V8.1c0-.9.3-1.5 1.6-1.5h1.6V3.9c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3V10H7.2v3h2.8v8z"/>
  </svg>`,

  instagram: makeInstagramSVG('instagramSocial'),

  youtube: `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path fill="#FF0033" d="M23 7a3 3 0 0 0-2.1-2.1C19 4.4 12 4.4 12 4.4s-7 0-8.9.5A3 3 0 0 0 1 7a31 31 0 0 0-.5 5 31 31 0 0 0 .5 5 3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5A3 3 0 0 0 23 17a31 31 0 0 0 .5-5 31 31 0 0 0-.5-5z"/>
    <path d="M9.6 8.5v7l6-3.5z" fill="#FFFFFF"/>
  </svg>`,

  whatsapp: `<svg viewBox="0 0 24 24" fill="#25D366">
    <path d="M12 2a9.8 9.8 0 0 0-8.4 14.8L2 22l5.4-1.5A9.8 9.8 0 1 0 12 2zm0 17.8a8 8 0 0 1-4.1-1.1l-.3-.2-3.2.9.9-3.1-.2-.3A8 8 0 1 1 12 19.8zm4.4-6c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1-.2.2-.6.8-.8.9-.1.2-.3.2-.5.1-.2-.1-1-.4-1.9-1.2-.7-.6-1.2-1.4-1.3-1.6-.1-.2 0-.3.1-.5l.4-.4.2-.4c.1-.2 0-.3 0-.4l-.7-1.7c-.2-.4-.4-.4-.5-.4h-.5c-.2 0-.4.1-.6.3-.2.2-.8.8-.8 1.9s.8 2.2.9 2.4c.1.2 1.6 2.5 3.8 3.4 1.4.6 1.9.6 2.6.5.4-.1 1.4-.6 1.6-1.1.2-.5.2-1 .1-1.1-.1-.1-.2-.2-.4-.3z"/>
  </svg>`
};

/* URL VALIDATION */

function safeUrl(value) {
  try {
    const url = new URL(String(value || '').trim());

    return ['https:', 'http:'].includes(url.protocol)
      ? url.href
      : '';
  } catch (error) {
    return '';
  }
}

/* YOUTUBE VIDEO ID */

function getYouTubeVideoId(value) {
  try {
    const url = new URL(value);
    let id = '';

    if (url.hostname.includes('youtu.be')) {
      id = url.pathname.split('/').filter(Boolean)[0] || '';
    } else if (
      url.pathname.startsWith('/shorts/') ||
      url.pathname.startsWith('/embed/') ||
      url.pathname.startsWith('/live/')
    ) {
      id = url.pathname.split('/')[2] || '';
    } else {
      id = url.searchParams.get('v') || '';
    }

    return /^[a-zA-Z0-9_-]{11}$/.test(id) ? id : '';
  } catch (error) {
    return '';
  }
}

/* SOCIAL LINKS */

function addSocial(name, url) {
  const validUrl = safeUrl(url);

  if (!validUrl || !socialIcons[name]) return;

  const link = document.createElement('a');

  link.className = 'social-' + name;
  link.href = validUrl;
  link.target = '_blank';
  link.rel = 'noopener noreferrer';
  link.setAttribute('aria-label', name);
  link.innerHTML = socialIcons[name];

  document.getElementById('socials').appendChild(link);
}

/* DETECT BUTTON BRAND */

function detectBrand(label, url) {
  let host = '';

  try {
    host = new URL(url).hostname.toLowerCase();
  } catch (error) {}

  const text = (
    String(label || '') + ' ' + String(url || '')
  ).toLowerCase();

  if (
    host.includes('facebook.com') ||
    host.includes('fb.com') ||
    text.includes('facebook')
  ) return 'facebook';

  if (
    host.includes('instagram.com') ||
    host.includes('instagr.am') ||
    text.includes('instagram')
  ) return 'instagram';

  if (
    host.includes('whatsapp.com') ||
    host.includes('wa.me') ||
    text.includes('whatsapp')
  ) return 'whatsapp';

  if (
    host.includes('youtube.com') ||
    host.includes('youtu.be') ||
    text.includes('youtube')
  ) return 'youtube';

  return '';
}

/* FACEBOOK BUTTON SVG */

function makeFacebookButtonSVG() {
  return `
  <svg viewBox="0 0 48 48"
       xmlns="http://www.w3.org/2000/svg"
       aria-hidden="true">
    <circle class="facebook-circle" cx="24" cy="24" r="23"/>
    <path class="facebook-letter"
      d="M27.2 41V26.1h5l.8-5.8h-5.8v-3.7c0-1.7.5-2.9 2.9-2.9h3.1V8.5c-.5-.1-2.4-.2-4.5-.2-4.5 0-7.6 2.7-7.6 7.8v4.2H16v5.8h5.1V41h6.1z"/>
  </svg>`;
}

/* CUSTOM BUTTONS */

function addButton(icon, label, url) {
  const validUrl = safeUrl(url);

  if (!validUrl || !String(label || '').trim()) return;

  const link = document.createElement('a');

  link.className = 'action-btn';
  link.href = validUrl;
  link.target = '_blank';
  link.rel = 'noopener noreferrer';

  const brand = detectBrand(label, validUrl);

  const iconElement = document.createElement('span');
  iconElement.className = 'btn-icon';

  if (brand === 'facebook') {
    iconElement.classList.add('btn-icon-facebook');
    iconElement.innerHTML = makeFacebookButtonSVG();

  } else if (brand === 'instagram') {
    iconElement.classList.add('btn-icon-instagram');
    iconElement.innerHTML = makeInstagramButtonSVG();

  } else if (brand && socialIcons[brand]) {
    iconElement.classList.add('btn-icon-' + brand);
    iconElement.innerHTML = socialIcons[brand];

  } else {
    iconElement.textContent = icon || '🔗';
  }

  const labelElement = document.createElement('span');
  labelElement.className = 'btn-label';
  labelElement.textContent = label;

  link.appendChild(iconElement);
  link.appendChild(labelElement);

  document.getElementById('buttons').appendChild(link);
}

/* FAST LOADING RELEASE */

let profileIsReady = false;

function finishProfileLoading() {
  if (profileIsReady) return;

  profileIsReady = true;
  document.body.classList.remove('profile-loading');
}

/* ERROR MESSAGE */

function showError(message, releaseLoading) {
  if (releaseLoading !== false) finishProfileLoading();

  const buttons = document.getElementById('buttons');
  buttons.innerHTML = '';

  const messageElement = document.createElement('p');
  messageElement.className = 'loading';
  messageElement.textContent = message;

  buttons.appendChild(messageElement);
}

/* LATEST VIDEO THUMBNAIL */

function renderVideo(data) {
  const videoUrl = safeUrl(
    data.latestVideoUrl || data.videoUrl
  );

  const videoId =
    (videoUrl ? getYouTubeVideoId(videoUrl) : '') ||
    DEFAULT_VIDEO_ID;

  const videoSection =
    document.getElementById('videoSection');

  const thumbnail =
    document.getElementById('videoThumbnail');

  const videoLink = document.getElementById('videoLink');

  videoLink.href = YOUTUBE_CHANNEL_URL;

  if (videoLink.dataset.videoId === videoId) {
    videoSection.hidden = false;
    return;
  }

  videoLink.dataset.videoId = videoId;

  const thumbnailOptions = [
    'https://img.youtube.com/vi/' + videoId + '/maxresdefault.jpg',
    'https://img.youtube.com/vi/' + videoId + '/hqdefault.jpg',
    'https://img.youtube.com/vi/' + videoId + '/mqdefault.jpg',
    'https://img.youtube.com/vi/' + videoId + '/default.jpg'
  ];

  let thumbnailIndex = 0;

  thumbnail.onerror = function() {
    thumbnailIndex++;

    if (thumbnailIndex < thumbnailOptions.length) {
      thumbnail.src = thumbnailOptions[thumbnailIndex];
    } else {
      thumbnail.onerror = null;
      thumbnail.alt = 'ভিডিওটি দেখতে ONLINE TV YouTube চ্যানেলে যান';
    }
  };

  thumbnail.src = thumbnailOptions[0];

  videoSection.hidden = false;
}

/* IMMEDIATE FIRST-VISIT CONTENT */

function showImmediateSocials() {
  const socials = document.getElementById('socials');
  if (!socials || socials.children.length) return;

  addSocial('facebook', 'https://www.facebook.com/oonlinetv420');
  addSocial('instagram', 'https://www.instagram.com/oonlinetv420/');
  addSocial('youtube', 'https://www.youtube.com/@oonlinetb420');
  addSocial('whatsapp', 'https://wa.me/8801805205471');
}

/* APPLY SAVED ADMIN THEME */

function applySelectedTheme(value) {
  const allowedThemes = [
    'default-blue', 'professional-red', 'green-fresh',
    'purple-elegant', 'orange-premium', 'light-white', 'black-glass'
  ];

  const theme = allowedThemes.includes(String(value || '').trim())
    ? String(value).trim()
    : 'professional-red';

  document.body.setAttribute('data-theme', theme);
}

/* PROFILE RENDER */

function renderProfile(data) {
  if (!data || typeof data !== 'object' || data.error) {
    showError('সঠিক তথ্য পাওয়া যায়নি।');
    return;
  }

  applySelectedTheme(data.selectedTheme);

  document.title =
    (data.title || 'ONLINE TV') + ' | Official';

  const titleText =
    String(data.title || 'ONLINE TV').replace(/:$/, '').trim();

  const titleElement = document.getElementById('title');

  if (titleText.toUpperCase() === 'ONLINE TV') {
    titleElement.innerHTML =
      '<span style="color:#fff">ONLINE</span> ' +
      '<span style="color:#ff3155">TV</span>';
  } else {
    titleElement.textContent = titleText;
  }

  document.getElementById('tagline').textContent =
    data.tagline || '';

  const imageUrl = safeUrl(
    data.profileImage || data.logoText
  );

  const profileImage = document.getElementById('profileImage');

  if (imageUrl && profileImage.getAttribute('src') !== imageUrl) {
    profileImage.fetchPriority = 'high';
    profileImage.loading = 'eager';
    profileImage.src = imageUrl;
  }

  document.getElementById('socials').innerHTML = '';

  [
    'facebook',
    'instagram',
    'youtube',
    'whatsapp'
  ].forEach(function(name) {
    addSocial(name, data[name]);
  });

  renderVideo(data);

  const buttons = document.getElementById('buttons');
  buttons.innerHTML = '';

  for (let i = 1; i <= 4; i++) {
    addButton(
      data['button' + i + 'Icon'],
      data['button' + i + 'Text'],
      data['button' + i + 'Url']
    );
  }

  if (!buttons.children.length) {
    showError('কাস্টম বাটন এখনো যোগ করা হয়নি।', false);
  }

  finishProfileLoading();
}

/* FAST CACHE + GOOGLE APPS SCRIPT */

let profileRequestInProgress = false;

function loadProfile() {
  if (profileRequestInProgress) return;

  profileRequestInProgress = true;

  const CACHE_KEY = 'onlineTVProfileCache';
  let hasCachedData = false;

  try {
    const cachedData = localStorage.getItem(CACHE_KEY);

    if (cachedData) {
      const parsedData = JSON.parse(cachedData);

      if (parsedData && typeof parsedData === 'object') {
        renderProfile(parsedData);
        hasCachedData = true;
      }
    }
  } catch (error) {
    console.warn('Profile cache error:', error);
  }

  const callbackName =
    'onlineTVCallback_' + Date.now() + '_' +
    Math.random().toString(36).slice(2);

  let finished = false;
  const script = document.createElement('script');

  const timeout = setTimeout(function() {
    if (finished) return;

    finished = true;
    profileRequestInProgress = false;
    delete window[callbackName];
    script.remove();

    if (!hasCachedData) {
      showError('তথ্য লোড হয়নি। আবার চেষ্টা করুন।');
    }
  }, 20000);

  window[callbackName] = function(data) {
    if (finished) return;

    finished = true;
    clearTimeout(timeout);
    profileRequestInProgress = false;

    try {
      if (data && typeof data === 'object' && !data.error) {
        renderProfile(data);

        localStorage.setItem(
          CACHE_KEY,
          JSON.stringify(data)
        );
      } else if (!hasCachedData) {
        showError('সঠিক তথ্য পাওয়া যায়নি।');
      }

    } catch (error) {
      console.error('Profile display error:', error);

      if (!hasCachedData) {
        showError('প্রোফাইল দেখাতে সমস্যা হয়েছে।');
      }
    }

    delete window[callbackName];
    script.remove();
  };

  script.onerror = function() {
    if (finished) return;

    finished = true;
    clearTimeout(timeout);
    profileRequestInProgress = false;
    delete window[callbackName];

    if (!hasCachedData) {
      showError('Google Apps Script-এর সঙ্গে সংযোগ হয়নি।');
    }

    script.remove();
  };

  script.src = APPS_SCRIPT_URL +
    '?callback=' + encodeURIComponent(callbackName) +
    '&t=' + Date.now();

  document.body.appendChild(script);
}

/* FIRST LOAD */

showImmediateSocials();
loadProfile();

/* REFRESH PROFILE EVERY 2 MINUTES */

setInterval(function() {
  loadProfile();
}, 120000);

</script>
